name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mailarchive
          POSTGRES_PASSWORD: mailarchive
          POSTGRES_DB: mailarchive
        # Random host port on loopback; the test step reads it below.
        ports: ["127.0.0.1::5432"]
        options: >-
          --health-cmd "pg_isready -U mailarchive"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://mailarchive:mailarchive@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mailarchive?sslmode=disable

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      # Generated database code must match internal/store/queries.
      - run: make sqlc-check
      # The Dockerfile's Go version guard must pass and fail where it should.
      - run: sh scripts/check-go-toolchain-test.sh

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # govulncheck version is pinned in the Makefile and verified through
      # the Go checksum database.
      - run: make vuln

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 and arm64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  compose:
    # End-to-end test of docker-compose.yml, the image and the ./ma wrapper.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/compose-smoke-test.sh
      # The release bundle, with the image the run above built: its
      # docker-compose.yml must work without the source and without a build.
      - name: Release bundle
        run: |
          scripts/release-bundle.sh 99.01-1 "$RUNNER_TEMP/dist"
          # No entry may carry the runner's UID.
          tar -tvzf "$RUNNER_TEMP/dist/mail-archive.tar.gz" | awk '$2 != "0/0" { print; bad = 1 } END { exit bad }'
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/dist/mail-archive.tar.gz"
          SMOKE_DIR="$RUNNER_TEMP/mail-archive" MAIL_ARCHIVE_IMAGE=mail-archive:smoke scripts/compose-smoke-test.sh
      - name: Release version numbers
        run: |
          set -eu
          git init -q "$RUNNER_TEMP/tags" && cd "$RUNNER_TEMP/tags"
          git -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m tags
          check() { got=$("$GITHUB_WORKSPACE/scripts/next-version.sh" "$1"); [ "$got" = "$2" ] || { echo "$1: got $got, want $2"; exit 1; }; }
          check 26.10 26.10-1
          git tag v26.10-1 && git tag v26.10-3 && git tag v26.09-7 && git tag v26.10-rc
          check 26.10 26.10-4
          check 26.11 26.11-1

  web:
    runs-on: ubuntu-latest
    env:
      # Second guard against the telemetry postinstall of the Carbon packages;
      # web/pnpm-workspace.yaml blocks their install scripts.
      IBM_TELEMETRY_DISABLED: "true"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node 25+ no longer bundles corepack; keep the version in sync with the Dockerfile.
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod

  # Decides whether a pull request is docs-only (only docs/**, .claude/** or
  # *.md changed), so web-e2e can be skipped. The skip is at job level, not a
  # workflow-level `paths:` filter: a required check that never runs stays
  # pending for ever, while a job skipped by `if:` counts as passing.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the base commit is reachable for the diff.
          fetch-depth: 0
      - run: sh scripts/ci-docs-only-test.sh
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          docs_only=false
          if [ "$EVENT_NAME" = pull_request ]; then
            # --no-renames: a code file moved into docs/ lists its old path too.
            # quotePath=false: non-ASCII names are not quoted. The diff goes to a
            # file first, so a git failure stops the step and shows in the log.
            git -c core.quotePath=false diff --name-only --no-renames \
              "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            if sh scripts/ci-docs-only.sh < "$RUNNER_TEMP/changed-paths"; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  web-e2e:
    # Playwright end-to-end tests of the web UI against the demo server
    # (tools/demo: made-up mail, a temporary database, no network).
    # Skipped on docs-only pull requests. Fail closed: it runs unless this is a
    # pull request, `changes` succeeded and said docs_only. !cancelled() (not
    # always()) is needed because a failed `changes` would otherwise skip this
    # job, and a skipped job passes a required check; it also keeps a cancelled
    # (superseded) run from starting e2e.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Second guard against the telemetry postinstall of the Carbon packages;
      # web/pnpm-workspace.yaml blocks their install scripts.
      IBM_TELEMETRY_DISABLED: "true"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mailarchive
          POSTGRES_PASSWORD: mailarchive
          POSTGRES_DB: mailarchive
        ports: ["127.0.0.1::5432"]
        options: >-
          --health-cmd "pg_isready -U mailarchive"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node 25+ no longer bundles corepack; keep the version in sync with the Dockerfile.
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      # The headless Chromium of the pinned Playwright, with its system
      # libraries: --with-deps installs them with apt, so the job does not
      # depend on what the runner image happens to ship.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      # The config builds the UI, then builds and starts the demo (it embeds
      # the built UI), and stops it at the end so it drops its database.
      - run: pnpm e2e
        env:
          DEMO_DATABASE_URL: postgres://mailarchive:mailarchive@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mailarchive?sslmode=disable
