name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request run cancels the older run of the same pull request (its group
# is the PR ref). A push to main gets a group of its own per commit and is never
# cancelled, so every merge gets a complete CI result, also when the next merge
# follows seconds later (the same rule as secrets.yml).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Docker Hub images: CI pulls them through mirror.gcr.io (Google's public
# Docker Hub cache), with Docker Hub as the fallback, so a Docker Hub error or
# rate limit does not fail a job (option (b) of #216, as in paperless-go; no
# secrets, the same for fork and Dependabot pull requests). dockerd gets the
# mirror from scripts/ci-docker-mirror.sh, the docker job's buildx builder from
# buildkitd-config-inline, and the PostgreSQL services of test, web-e2e and
# web-e2e-webkit name the mirror directly. The script also drops the runner's Docker Hub login
# for the job's later steps, because dockerd would send it to the mirror, which
# refuses it: pulls are anonymous. Users' builds (the Dockerfile,
# docker-compose.yml, ./ma, release.yml) do not use the mirror.
#
# Timeouts are about 2-5 times the longest run seen (the last 400 runs,
# 2026-10-06 to 2026-10-23).

jobs:
  test:
    runs-on: ubuntu-latest
    # The slowest passing run took 7.7 min.
    timeout-minutes: 20
    services:
      postgres:
        # The runner pulls service images before any step, so no daemon
        # mirror config applies here: the image is named on mirror.gcr.io
        # directly, without a Docker Hub fallback (the runner retries a failed
        # pull itself). postgres:18 is a heavily used tag and always cached
        # there, though the mirror may serve the previous patch release for a
        # short time after a new one. Should the mirror ever fail this job,
        # start PostgreSQL with `docker run` in a step after
        # scripts/ci-docker-mirror.sh instead. It keeps the image's default
        # glibc locale (no POSTGRES_INITDB_ARGS): the collation tests, which
        # simulate a database built by postgres:18-alpine, need it.
        image: mirror.gcr.io/library/postgres:18
        env:
          POSTGRES_USER: mailarchive
          POSTGRES_PASSWORD: mailarchive
          POSTGRES_DB: mailarchive
        # Random host port on loopback; the test step reads it below.
        ports: ["127.0.0.1::5432"]
        options: >-
          --health-cmd "pg_isready -U mailarchive"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      # Random test order (-shuffle=on): a failure prints its seed as
      # -test.shuffle N; rerun it with go test -shuffle=N.
      - run: go test -race -shuffle=on -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://mailarchive:mailarchive@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mailarchive?sslmode=disable

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      # Generated database code must match internal/store/queries.
      - run: make sqlc-check
      # The Dockerfile's Go version guard must pass and fail where it should.
      - run: sh scripts/check-go-toolchain-test.sh

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # govulncheck version is pinned in the Makefile and verified through
      # the Go checksum database.
      - run: make vuln

  review-gate:
    # Deterministic checks on what a pull request changes, for the reviewer
    # (docs/development/review-gate.md): noctx on added Go lines, squawk on
    # new migrations, migration-changed, oxlint on all of web/src,
    # actionlint and zizmor on changed workflows (zizmor is pip-installed from
    # hash-pinned wheels into a venv with the runner's python3; no
    # setup-python, no new action). Not a required check; the reviewer
    # records an outcome for each finding, and a red or missing gate is not a
    # pass. Pushes to main run only the self-test, which also saves the tool
    # caches that pull requests read.
    runs-on: ubuntu-latest
    # A cold run builds golangci-lint (about 1 min); a warm one takes seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the base commit is reachable for the diff.
          fetch-depth: 0
      # The tool builds get a Go cache of their own, keyed on the Makefile
      # (where the versions are pinned), and the npm cache is keyed on the
      # gate's lockfile; no cache action is needed.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: Makefile
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/review-gate/package-lock.json
      - run: make review-gate-tools
      - run: make review-gate-test
      # oxlint's type-aware rules need the UI's dependencies. They are
      # installed (as in the web job, from the lockfile, install scripts
      # blocked) only when the pull request changes what the gate runs oxlint
      # for: web/src TypeScript, the web dependencies and tsconfigs, the
      # oxlint config and lockfile (the same list as in
      # scripts/review-gate.sh); the corepack download comes from the npm
      # cache above.
      - name: Web dependencies
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Second guard against the telemetry postinstall of the Carbon
          # packages; web/pnpm-workspace.yaml blocks their install scripts.
          IBM_TELEMETRY_DISABLED: "true"
        run: |
          mb=$(git merge-base "$BASE_SHA" HEAD)
          if git diff --name-only --no-renames "$mb" HEAD -- 'web/src/*.ts' 'web/src/*.tsx' \
            web/package.json web/pnpm-lock.yaml 'web/tsconfig*.json' \
            tools/review-gate/oxlintrc.json tools/review-gate/package-lock.json | grep -q .; then
            # Node 25+ no longer bundles corepack; keep the version in sync with the Dockerfile.
            npm install -g corepack@0.36.0 && corepack enable
            cd web && pnpm install --frozen-lockfile
          else
            echo 'no web/src TypeScript, web dependency or oxlint config changes: web dependencies not needed'
          fi
      - name: Gate
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # A missing web/node_modules is an error here, not a skip.
          REVIEW_GATE_REQUIRE_WEB: "1"
        run: |
          rc=0
          make -s review-gate BASE="$BASE_SHA" >"$RUNNER_TEMP/gate.out" || rc=$?
          cat "$RUNNER_TEMP/gate.out"
          {
            echo '### review-gate'
            echo '```'
            cat "$RUNNER_TEMP/gate.out"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

  docker:
    runs-on: ubuntu-latest
    # Room for a run with a cold layer cache.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci-docker-mirror.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit in the builder container pulls the Dockerfile's images
          # (and its # syntax frontend) through the mirror, falling back to
          # Docker Hub when the mirror fails or lacks a tag.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build amd64 and arm64 images
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          # The layer cache in the GitHub Actions cache. Only pushes to main
          # write it (mode=max: every stage, so the pnpm install and go mod
          # download layers too); pull requests only read it, so their
          # entries cannot crowd main's out of the 10 GB cache. An empty
          # cache-to exports nothing. release.yml builds without a cache.
          cache-from: type=gha,scope=docker
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=docker' || '' }}

  compose:
    # End-to-end test of docker-compose.yml, the image and the ./ma wrapper.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/ci-docker-mirror.sh
      # The base images and postgres:18 with retries; the smoke test's build
      # then takes them from the local store.
      - run: scripts/ci-pull-images.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/compose-smoke-test.sh
      # The release bundle, with the image the run above built: its
      # docker-compose.yml must work without the source and without a build.
      - name: Release bundle
        run: |
          scripts/release-bundle.sh 99.0.0 "$RUNNER_TEMP/dist"
          # No entry may carry the runner's UID.
          tar -tvzf "$RUNNER_TEMP/dist/mail-archive.tar.gz" | awk '$2 != "0/0" { print; bad = 1 } END { exit bad }'
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/dist/mail-archive.tar.gz"
          SMOKE_DIR="$RUNNER_TEMP/mail-archive" MAIL_ARCHIVE_IMAGE=mail-archive:smoke scripts/compose-smoke-test.sh
      # The semver rules of scripts/next-version.sh, with JSON fixtures
      # instead of the GitHub API.
      - name: Release version numbers
        run: scripts/next-version-test.sh

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Second guard against the telemetry postinstall of the Carbon packages;
      # web/pnpm-workspace.yaml blocks their install scripts.
      IBM_TELEMETRY_DISABLED: "true"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node 25+ no longer bundles corepack; keep the version in sync with the Dockerfile.
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  audit:
    # pnpm audit of the UI's production dependencies. Not a required check:
    # it asks the npm registry, which can time out, and Dependabot covers the
    # same advisories. A finding still turns it red. It audits the lockfile,
    # so it needs no install.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # As in the web job, although nothing is installed here.
      IBM_TELEMETRY_DISABLED: "true"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node 25+ no longer bundles corepack; keep the version in sync with the Dockerfile.
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: pnpm audit --prod

  # Decides whether a pull request is docs-only (only docs/**, .claude/** or
  # *.md changed), so web-e2e can be skipped. The skip is at job level, not a
  # workflow-level `paths:` filter: a required check that never runs stays
  # pending for ever, while a job skipped by `if:` counts as passing.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the base commit is reachable for the diff.
          fetch-depth: 0
      - run: sh scripts/ci-docs-only-test.sh
      - run: sh scripts/makefile-pnpm-test.sh
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          docs_only=false
          if [ "$EVENT_NAME" = pull_request ]; then
            # --no-renames: a code file moved into docs/ lists its old path too.
            # quotePath=false: non-ASCII names are not quoted. The diff goes to a
            # file first, so a git failure stops the step and shows in the log.
            git -c core.quotePath=false diff --name-only --no-renames \
              "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"
            if sh scripts/ci-docs-only.sh < "$RUNNER_TEMP/changed-paths"; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  web-e2e:
    # Playwright end-to-end tests of the web UI against the demo server
    # (tools/demo: made-up mail, a temporary database, no network).
    # Skipped on docs-only pull requests. Fail closed: it runs unless this is a
    # pull request, `changes` succeeded and said docs_only. !cancelled() (not
    # always()) is needed because a failed `changes` would otherwise skip this
    # job, and a skipped job passes a required check; it also keeps a cancelled
    # (superseded) run from starting e2e.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    # Usually about 2 min; the 20 covers the apt fallback of
    # scripts/ci-playwright-chromium.sh (8-13 min here when the apt mirror was
    # slow). Lower it once the fallback is seen not to run.
    timeout-minutes: 20
    env:
      # Second guard against the telemetry postinstall of the Carbon packages;
      # web/pnpm-workspace.yaml blocks their install scripts.
      IBM_TELEMETRY_DISABLED: "true"
    services:
      postgres:
        # On mirror.gcr.io without a fallback and with the default glibc
        # locale, as in the test job (see there).
        image: mirror.gcr.io/library/postgres:18
        env:
          POSTGRES_USER: mailarchive
          POSTGRES_PASSWORD: mailarchive
          POSTGRES_DB: mailarchive
        ports: ["127.0.0.1::5432"]
        options: >-
          --health-cmd "pg_isready -U mailarchive"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node 25+ no longer bundles corepack; keep the version in sync with the Dockerfile.
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      # The headless Chromium of the pinned Playwright, without apt unless
      # the runner image lacks one of its libraries (then with a warning).
      - run: sh ../scripts/ci-playwright-chromium-test.sh
      - run: sh ../scripts/ci-playwright-chromium.sh
      # The config builds the UI, then builds and starts the demo (it embeds
      # the built UI), and stops it at the end so it drops its database.
      - run: pnpm e2e
        env:
          DEMO_DATABASE_URL: postgres://mailarchive:mailarchive@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mailarchive?sslmode=disable
      # On a failure, the test results (traces, the guards' frame diagnostics
      # of #260) are kept for a week. `path:` ignores working-directory. The
      # data is made up (the demo's own logins); artefacts of a public
      # repository are readable by anyone.
      - name: Upload e2e failure artefacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-test-results
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  web-e2e-webkit:
    # The mail frame's link spec (web/e2e/frame-links.spec.ts) in Playwright's
    # WebKit (#459): WebKit does not run the listeners the web UI adds to the
    # sandboxed mail frame, so this shows that the server's link rewrite holds
    # there. One spec until #398 runs the suite in WebKit. Not a required
    # check; a red result still blocks merging. The same `if:` as web-e2e.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    runs-on: ubuntu-latest
    # `playwright install --with-deps webkit` always runs apt: 8-13 min when
    # the mirror is slow (scripts/ci-playwright-chromium.sh:5-8), then the
    # build and one spec.
    timeout-minutes: 30
    env:
      # Second guard against the telemetry postinstall of the Carbon packages;
      # web/pnpm-workspace.yaml blocks their install scripts.
      IBM_TELEMETRY_DISABLED: "true"
    services:
      postgres:
        # On mirror.gcr.io without a fallback and with the default glibc
        # locale, as in the test job (see there).
        image: mirror.gcr.io/library/postgres:18
        env:
          POSTGRES_USER: mailarchive
          POSTGRES_PASSWORD: mailarchive
          POSTGRES_DB: mailarchive
        ports: ["127.0.0.1::5432"]
        options: >-
          --health-cmd "pg_isready -U mailarchive"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Node 25+ no longer bundles corepack; keep the version in sync with the Dockerfile.
      - run: npm install -g corepack@0.36.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      # WebKit of the pinned Playwright and its system libraries, which the
      # runner image does not have.
      - run: pnpm exec playwright install --with-deps webkit
      # As in web-e2e: the config builds the UI and the demo, starts it and
      # stops it at the end. E2E_BROWSER=webkit runs only the WebKit project.
      - run: pnpm e2e:webkit
        env:
          DEMO_DATABASE_URL: postgres://mailarchive:mailarchive@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mailarchive?sslmode=disable
      # As in web-e2e: traces (without screenshots) and the guards' frame
      # diagnostics, kept for a week. The data is made up.
      - name: Upload e2e failure artefacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e-webkit-test-results
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore
