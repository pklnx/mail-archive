name: Release

# Publishes a release from main, started by hand (Actions → Release → Run
# workflow). The version is semantic, X.Y.Z (scripts/next-version.sh): the
# labels of the pull requests merged since the last release decide the bump
# (breaking → major, feature or db-migration → minor, else patch); the first
# semver release is 1.0.0. The input `version` overrides the proposal. It
# runs two jobs. `release` builds and pushes the image for linux/amd64 and
# linux/arm64 to ghcr.io with the exact tag X.Y.Z only, then creates the tag
# vX.Y.Z and a GitHub release with the Docker Compose bundle
# (scripts/release-bundle.sh) and notes: a head from scripts/release-notes.sh,
# then the pull requests grouped by label (.github/release.yml). After it,
# `floating-tags` checks that the release is published and is the highest
# version, moves X.Y, X and latest to the digest the build pushed and checks
# that all four tags have that digest. So a failed release never leaves a
# floating tag on a build without a release. Run it after CI on main is
# green; a dry run shows the proposed version, the pull requests behind it,
# the tags and the notes head, and skips `floating-tags`.
#
# Runbook: a failed run (the same text used to be in
# docs/development/process.md, "Releases").
#
# If the job `release` fails in or after "Build and push" (in "Create the
# release"), the image tag X.Y.Z may already point to the new build, but
# there is no release. `floating-tags` did not run, so X.Y, X and latest
# still point to the previous release. To finish the release:
#   1. Fix the cause.
#   2. Delete the draft release vX.Y.Z if the Releases page shows one (the
#      check "Tag and release do not exist yet" stops at it).
#   3. If the tag vX.Y.Z exists without a release, delete the tag too (it
#      points to this run's commit). Do not follow the run's advice to set
#      the `version` input: that ships the next version and leaves the stray
#      tag.
#   4. Use "Re-run failed jobs" on the same run. It uses the same commit and
#      inputs, overwrites X.Y.Z with a build of the same commit, creates the
#      release and then runs `floating-tags`, which moves the floating tags
#      to the new digest. It computes the same version only while the labels
#      of the pull requests in the range are unchanged (they are read from
#      the API again): compare the version in the re-run's summary with the
#      first attempt.
# To abandon such a release instead, delete the new package version that
# carries X.Y.Z (package settings on GitHub, "Manage versions"); no floating
# tag has to move back.
#
# If the job `floating-tags` fails (a registry error, a digest mismatch), the
# release is published and X.Y, X and latest may point to the new build, to
# the previous one or (after a partial move) some to each. Fix the cause and
# use "Re-run failed jobs": it runs only `floating-tags`, with the version
# and digest of the successful `release` job, and moving the tags again is
# harmless. Do not use "Re-run all jobs": the "Version" step stops it with
# "nothing merged since X.Y.Z; there is nothing to release" (the range from
# the new tag to the same commit is empty), so nothing is built twice. By
# hand instead, after a `docker login ghcr.io` with a token that has
# write:packages, for each of X.Y, X and latest:
#   docker buildx imagetools create -t ghcr.io/pklnx/mail-archive:1.2 ghcr.io/pklnx/mail-archive:1.2.3
#
# To abandon a published release, point the tags X.Y, X and latest back to
# the previous release by hand (the same command), delete the release and
# its tag, and delete the new package version:
#   docker buildx imagetools create -t ghcr.io/pklnx/mail-archive:latest ghcr.io/pklnx/mail-archive:26.10-11
# For 1.0.0, move latest back to 26.10-11, then delete the package version
# that carries 1.0.0; that removes 1.0.0, 1.0 and 1, which did not exist
# before. For a later release, also move X and X.Y back to the previous
# release if it has them (abandoning 1.3.0 after 1.2.4: latest and 1 to
# 1.2.4; 1.3 goes with the package version).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything, but push no image and create no release
        type: boolean
        default: false
      version:
        description: Override the proposed version, X.Y.Z, greater than the last release
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # About 2 min so far; started by hand, so a timeout only costs a rerun.
    timeout-minutes: 15
    permissions:
      contents: write # the tag and the release
      packages: write # the image on ghcr.io
      pull-requests: read # the pull requests behind the commits, for the version
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
      minor: ${{ steps.version.outputs.minor }}
      major: ${{ steps.version.outputs.major }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # No job-level `if:`: a run from another ref fails here visibly instead
      # of a silent green skip. It runs before the checkout.
      - name: Started on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::release.yml runs only on main, not on '$GITHUB_REF'"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags and the history since the last release
          persist-credentials: false

      # Lists the first-parent commits since the last release, finds each
      # one's pull request and lets scripts/next-version.sh decide the
      # version. The summary table is written before the version can fail.
      - name: Version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          base=$(scripts/next-version.sh base)
          last=$(scripts/next-version.sh last)
          range="${base:+$base..}HEAD"
          if ! shas=$(git rev-list --first-parent "$range"); then
            echo "::error::git rev-list $range failed"
            exit 1
          fi
          prs="$RUNNER_TEMP/prs.tsv"
          : > "$prs"
          for sha in $shas; do
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls?per_page=100" |
              scripts/next-version.sh pr "$sha" >> "$prs"
          done

          err="$RUNNER_TEMP/next-version.err"
          if proposal=$(scripts/next-version.sh next "$last" "" < "$prs" 2> "$err"); then
            from="proposal $proposal"
          else
            from="no proposal: $(cat "$err")"
          fi
          if [ -n "$VERSION_INPUT" ]; then
            from="override $VERSION_INPUT, $from"
          fi
          {
            echo "### Release version"
            echo
            echo "- From: $from"
            echo "- Last version: ${last:-none (first semver release)}"
            echo "- Range: $range"
            echo
            scripts/next-version.sh summary < "$prs"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if ! version=$(scripts/next-version.sh next "$last" "$VERSION_INPUT" < "$prs" 2> "$err"); then
            echo "::error::$(cat "$err")"
            echo "**No release:** $(cat "$err")" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # A version input below the proposal: the text holds only
          # validated X.Y.Z values.
          if [ -s "$err" ]; then
            echo "::warning::$(cat "$err")"
            echo "**Warning:** $(cat "$err")" >> "$GITHUB_STEP_SUMMARY"
          fi
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$version"
            echo "last=$last"
            echo "base=$base"
            echo "image=$image"
            echo "minor=${version%.*}"
            echo "major=${version%%.*}"
            # Only the exact tag; the job floating-tags moves the others
            # after the release.
            echo "tags=$image:$version"
          } >> "$GITHUB_OUTPUT"
          {
            echo "**Releasing $version** as $image"
            echo
            echo "- Tags: \`$version\` (this job, not in a dry run); \`${version%.*}\`, \`${version%%.*}\`, \`latest\` (job floating-tags, after the release; skipped in a dry run)"
          } >> "$GITHUB_STEP_SUMMARY"

      # Also stops a re-run of a finished release before anything is built
      # or pushed.
      - name: Tag and release do not exist yet
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags origin "refs/tags/v$VERSION")
          if [ -n "$refs" ]; then
            echo "::error::tag v$VERSION exists; set the version input"
            exit 1
          fi
          if out=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            echo "::error::release v$VERSION exists; set the version input"
            exit 1
          fi
          if [ "$out" != "release not found" ]; then
            echo "::error::could not check for release v$VERSION: $out"
            exit 1
          fi

      - name: Compose bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: scripts/release-bundle.sh "$VERSION" dist "$IMAGE"

      # The head of the notes, before the generated list. Also in dry runs,
      # so the summary shows it before the release.
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
          LAST: ${{ steps.version.outputs.last }}
        run: |
          scripts/release-notes.sh "$VERSION" "$IMAGE" "$LAST" > "$RUNNER_TEMP/notes.md"
          {
            echo "### Release notes (before the generated list)"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push amd64 and arm64 images
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.version.outputs.tags }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=mail-archive
            org.opencontainers.image.description=Read-only archive of IMAP mailboxes with search, export and a web UI
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://pklnx.github.io/mail-archive/
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      # gh release create would use an existing tag as it is (--target
      # ignored), so the tag check is repeated after the build. matching-refs
      # is a prefix match (v1.0.0 also finds v1.0.0-rc1), so the refs are
      # compared exactly.
      - name: Create the release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          BASE: ${{ steps.version.outputs.base }}
        run: |
          set -euo pipefail
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" --jq '.[].ref')
          if grep -qxF "refs/tags/v$VERSION" <<< "$refs"; then
            echo "::error::tag v$VERSION exists"
            exit 1
          fi
          start=()
          if [ -n "$BASE" ]; then
            start=(--notes-start-tag "$BASE")
          fi
          gh release create "v$VERSION" dist/mail-archive.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "mail-archive $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${start[@]}"

  # Moves X.Y, X and latest only after the release exists, to the digest the
  # build pushed as X.Y.Z (not to the mutable tag). Idempotent: after a
  # failure here, "Re-run failed jobs" runs only this job with the outputs
  # of the successful release job.
  floating-tags:
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # the checkout, the release and its tag
      packages: write # the tags on ghcr.io
    steps:
      # A draft is invisible with contents: read and reads as not found,
      # which also fails here. matching-refs is a prefix match, so the ref
      # is compared exactly; an annotated tag is dereferenced.
      - name: Release is published
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          if ! info=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease --jq '[.tagName, .isDraft, .isPrerelease] | @tsv' 2>&1); then
            echo "::error::release v$VERSION not found: $info"
            exit 1
          fi
          if [ "$info" != "v$VERSION"$'\t'"false"$'\t'"false" ]; then
            echo "::error::release v$VERSION is a draft or a pre-release (tag, draft, pre-release: $info)"
            exit 1
          fi
          line=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$VERSION" \
            --jq '.[] | [.ref, .object.type, .object.sha] | @tsv' |
            awk -F '\t' -v ref="refs/tags/v$VERSION" '$1 == ref { print $2 "\t" $3 }')
          if [ -z "$line" ]; then
            echo "::error::tag v$VERSION not found"
            exit 1
          fi
          type=${line%%$'\t'*}
          sha=${line#*$'\t'}
          for _ in 1 2 3 4 5; do
            [ "$type" = tag ] || break
            line=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '[.object.type, .object.sha] | @tsv')
            type=${line%%$'\t'*}
            sha=${line#*$'\t'}
          done
          if [ "$type" != commit ] || [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::tag v$VERSION points to $type $sha, not to $GITHUB_SHA"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, for the highest version
          persist-credentials: false

      # Today always true: the version must be greater than the last release
      # and the concurrency group serialises runs. Guards latest and X against
      # moving backwards, e.g. on a re-run of an old run after a newer release.
      - name: Highest version
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          last=$(scripts/next-version.sh last)
          if [ "$last" != "$VERSION" ]; then
            echo "::error::v$VERSION is not the highest release (that is v${last:-none}); the floating tags stay"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Move X.Y, X and latest
        shell: bash
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          DIGEST: ${{ needs.release.outputs.digest }}
          MINOR: ${{ needs.release.outputs.minor }}
          MAJOR: ${{ needs.release.outputs.major }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no image digest from the release job: '$DIGEST'"
            exit 1
          fi
          for tag in "$MINOR" "$MAJOR" latest; do
            docker buildx imagetools create -t "$IMAGE:$tag" "$IMAGE@$DIGEST"
          done

      - name: Digests are equal
        shell: bash
        env:
          IMAGE: ${{ needs.release.outputs.image }}
          DIGEST: ${{ needs.release.outputs.digest }}
          VERSION: ${{ needs.release.outputs.version }}
          MINOR: ${{ needs.release.outputs.minor }}
          MAJOR: ${{ needs.release.outputs.major }}
        run: |
          set -euo pipefail
          {
            echo "### Image tags"
            echo
            echo "| Tag | Digest |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          bad=0
          for tag in "$VERSION" "$MINOR" "$MAJOR" latest; do
            got=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            echo "| \`$tag\` | \`$got\` |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$got" != "$DIGEST" ]; then
              echo "::error::$IMAGE:$tag has digest $got, not $DIGEST"
              bad=1
            fi
          done
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Build digest: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          exit "$bad"
