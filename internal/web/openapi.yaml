# The JSON API of mail-archive, served as /api/openapi.json. Written by hand:
# TestOpenAPIRoutes compares it with the route table in routes.go, so every
# route needs an operation here, with the security its access requires.
openapi: 3.1.0
info:
  title: mail-archive
  version: "1"
  summary: A read-only, deduplicated archive of IMAP mailboxes.
  description: |
    The web UI is a client of this API; scripts can use it too. Every user
    only sees their own accounts and the messages found in them; other
    users' accounts and messages answer `404`.

    Requests authenticate with the session cookie of the web UI or with an
    API key: `Authorization: Bearer ma_…`. A key is created in the profile
    and has the scope `read` (messages, search, accounts, status), `sync`
    (starting syncs) or both; every other route is for sessions only. A key
    request never reads cookies. An invalid, revoked or expired key, or one
    whose owner is locked, answers `401`; a route outside the key's scopes
    `403`; more than 600 requests per key and minute `429`.

    Write requests (`POST`, `PUT`, `PATCH`, `DELETE`) with a session need
    `Content-Type: application/json`, also without a body, and an `Origin`
    header that matches the server. Requests with an API key need neither.

    A user who logged in with a generated password gets `403` with
    `"passwordChangeRequired": true` everywhere except
    `PUT /api/profile/password`. A user who must use two-factor
    authentication but has not set it up gets `403` with
    `"twoFactorSetupRequired": true` everywhere except the 2FA setup
    endpoints.

    Searches, opened messages, downloads, logins and changes are recorded in
    the audit log. If an entry cannot be written, the request answers `503`
    with "the audit log cannot be written; nothing was done", and nothing
    happens.
  license:
    name: MIT
    identifier: MIT
externalDocs:
  description: Documentation
  url: https://pklnx.github.io/mail-archive/reference/api

servers:
  - url: http://localhost:8080
    description: The default address; use your server's.

security:
  - session: []

tags:
  - name: health
    description: Health checks; no login needed.
  - name: session
    description: Login and logout.
  - name: profile
    description: The logged-in user's password, 2FA, passkeys and API keys.
  - name: users
    description: User management, for admins only.
  - name: accounts
    description: Mail accounts and syncing.
  - name: messages
    description: Listing, searching and reading messages.
  - name: audit
    description: The audit log.
  - name: retention
    description: Retention rules and legal holds, for admins only.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Server is running
      security: []
      responses:
        "200":
          description: The server runs.
          content:
            text/plain:
              schema:
                type: string
                const: "ok\n"

  /healthz/sync:
    get:
      tags: [health]
      operationId: getSyncHealth
      summary: Sync health of all accounts
      description: |
        Whether every enabled IMAP account syncs and every recurring fill
        runs. A failing or stale recurring fill lists the ID of its smtp
        account. Names no accounts, users or mail, only account IDs. Cached
        for 15 seconds.
      security: []
      responses:
        "200":
          description: Every enabled account syncs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncHealth"
        "503":
          description: Some accounts fail or are stale, or the database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncHealth"

  /api/openapi.json:
    get:
      tags: [health]
      operationId: getOpenAPI
      summary: This description
      description: Answers `If-None-Match` with `304`.
      security: []
      responses:
        "200":
          description: The OpenAPI description of the API.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
        "304":
          description: Unchanged since the ETag in `If-None-Match`.

  /api/session:
    get:
      tags: [session]
      operationId: getSession
      summary: The logged-in user
      security: []
      responses:
        "200":
          description: A valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: No valid session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoSession"
    post:
      tags: [session]
      operationId: login
      summary: Log in with a password
      description: |
        Sets the session cookie. For a user with 2FA it sets no cookie and
        answers with a challenge for `POST /api/session/2fa` instead, valid
        for 5 minutes and once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              additionalProperties: false
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Logged in, or the second step is needed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Session"
                  - $ref: "#/components/schemas/TwoFactorChallenge"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Wrong user name or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The user is locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [session]
      operationId: logout
      summary: Log out
      security: []
      responses:
        "204":
          description: Logged out; the cookie is cleared.

  /api/session/2fa:
    post:
      tags: [session]
      operationId: loginTwoFactor
      summary: Second login step
      description: Finishes a login of a user with 2FA and sets the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge, code]
              additionalProperties: false
              properties:
                challenge:
                  type: string
                  description: From `POST /api/session`.
                code:
                  type: string
                  description: A TOTP code or a recovery code.
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Wrong code, or the challenge expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/session/passkey/begin:
    post:
      tags: [session]
      operationId: beginPasskeyLogin
      summary: Start a passkey login
      security: []
      responses:
        "200":
          description: Options for `navigator.credentials.get()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ceremony"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/PasskeysOff"

  /api/session/passkey/finish:
    post:
      tags: [session]
      operationId: finishPasskeyLogin
      summary: Finish a passkey login
      description: Sets the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeremonyResult"
      responses:
        "200":
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: |
            The passkey was not accepted or the token expired. For an unknown
            passkey also `unknownCredential` with `credentialId` and `rpId`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnknownPasskey"
        "403":
          description: The user is locked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/PasskeysOff"

  /api/profile:
    patch:
      tags: [profile]
      operationId: updateProfile
      summary: Change the own web UI settings
      description: |
        Changes the language and the formats of dates and numbers. The
        settings are read from the user in the session (`GET /api/session`).
        An unchanged value is no change and is not logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                language:
                  $ref: "#/components/schemas/Language"
                locale:
                  $ref: "#/components/schemas/Locale"
      responses:
        "204":
          description: Changed, or nothing to change.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/profile/password:
    put:
      tags: [profile]
      operationId: changeOwnPassword
      summary: Change the own password
      description: Other sessions of the user end.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              additionalProperties: false
              properties:
                current:
                  type: string
                new:
                  type: string
      responses:
        "204":
          description: Changed.
        "400":
          description: The new password is too short or unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The current password is wrong (counts like a failed login), or no session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/profile/2fa:
    get:
      tags: [profile]
      operationId: getTwoFactor
      summary: The own 2FA state
      responses:
        "200":
          description: The state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactor"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [profile]
      operationId: disableTwoFactor
      summary: Turn 2FA off
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, code]
              additionalProperties: false
              properties:
                currentPassword:
                  type: string
                code:
                  type: string
                  description: A TOTP code or a recovery code.
      responses:
        "204":
          description: 2FA is off.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Wrong password or code, or no session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: 2FA is required for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/SecretKeyMissing"

  /api/profile/2fa/setup:
    post:
      tags: [profile]
      operationId: beginTwoFactorSetup
      summary: Start the 2FA setup
      description: Creates a new TOTP secret and returns it once.
      responses:
        "200":
          description: The secret, as text, URI and QR code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 2FA is already on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/SecretKeyMissing"

  /api/profile/2fa/confirm:
    post:
      tags: [profile]
      operationId: confirmTwoFactorSetup
      summary: Finish the 2FA setup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeInput"
      responses:
        "200":
          description: 2FA is on. The recovery codes are shown only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Wrong code, or no session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/SecretKeyMissing"

  /api/profile/2fa/recovery-codes:
    post:
      tags: [profile]
      operationId: regenerateRecoveryCodes
      summary: New recovery codes
      description: The old recovery codes stop working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeInput"
      responses:
        "200":
          description: The new recovery codes, shown only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Wrong code, or no session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/SecretKeyMissing"

  /api/profile/passkeys:
    get:
      tags: [profile]
      operationId: listPasskeys
      summary: The own passkeys
      responses:
        "200":
          description: The passkeys.
          content:
            application/json:
              schema:
                type: object
                required: [available, max, passkeys]
                properties:
                  available:
                    type: boolean
                    description: False without `MAIL_ARCHIVE_PUBLIC_URL`.
                  origin:
                    type: string
                    description: Where passkeys work; missing when they are off.
                  max:
                    type: integer
                  passkeys:
                    type: array
                    items:
                      $ref: "#/components/schemas/Passkey"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/profile/passkeys/begin:
    post:
      tags: [profile]
      operationId: beginPasskeyRegistration
      summary: Start adding a passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, currentPassword]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                currentPassword:
                  type: string
                code:
                  type: string
                  description: A TOTP code or a recovery code; only with 2FA on.
      responses:
        "200":
          description: Options for `navigator.credentials.create()`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ceremony"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Wrong password or code (counts like a failed login), or no session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The name is in use, or the user has the maximum number of passkeys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/PasskeysOff"

  /api/profile/passkeys/finish:
    post:
      tags: [profile]
      operationId: finishPasskeyRegistration
      summary: Finish adding a passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CeremonyResult"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
        "400":
          description: An expired token, or a passkey that is not accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The passkey is already registered, or the limit is reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/PasskeysOff"

  /api/profile/passkeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: [profile]
      operationId: removePasskey
      summary: Remove an own passkey
      description: All other sessions of the user end.
      responses:
        "200":
          description: |
            Removed. The answer is meant for
            `PublicKeyCredential.signalUnknownCredential()`.
          content:
            application/json:
              schema:
                type: object
                required: [credentialId, rpId]
                properties:
                  credentialId:
                    type: string
                  rpId:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/profile/api-keys:
    get:
      tags: [profile]
      operationId: listAPIKeys
      summary: The own API keys
      description: Also revoked and expired keys, for 30 days.
      responses:
        "200":
          description: The keys.
          content:
            application/json:
              schema:
                type: object
                required: [max, keys]
                properties:
                  max:
                    type: integer
                    description: How many active keys a user can have.
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [profile]
      operationId: createAPIKey
      summary: Create an API key
      description: |
        Needs the password and, with 2FA on, a TOTP or recovery code. The key
        is in the answer and shown only there; only its SHA-256 is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes, currentPassword]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                scopes:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/APIKeyScope"
                expiresInDays:
                  type: [integer, "null"]
                  minimum: 1
                  maximum: 3650
                  description: Days until the key expires; null or missing for never.
                currentPassword:
                  type: string
                code:
                  type: string
                  description: A TOTP code or a recovery code; only with 2FA on.
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/APIKey"
                  - type: object
                    required: [key]
                    properties:
                      key:
                        type: string
                        pattern: "^ma_[a-z2-7]{52}$"
                        description: The key, shown only here.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Wrong password or code (counts like a failed login), or no session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The name is in use, or the user has the maximum number of keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/profile/api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/apiKeyID"
    delete:
      tags: [profile]
      operationId: revokeAPIKey
      summary: Revoke an own API key
      description: Needs no password. Another user's key answers `404`.
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: All users
      responses:
        "200":
          description: The users.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"
    post:
      tags: [users]
      operationId: createUser
      summary: Add a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                admin:
                  type: boolean
                  default: false
      responses:
        "201":
          description: Added. The generated password is shown only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPassword"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "409":
          description: The name is taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/users/{name}:
    parameters:
      - $ref: "#/components/parameters/userName"
    patch:
      tags: [users]
      operationId: updateUser
      summary: Change a user's role or lock state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Exactly one of the two fields.
              type: object
              additionalProperties: false
              minProperties: 1
              maxProperties: 1
              properties:
                admin:
                  type: boolean
                locked:
                  type: boolean
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnlyNotSelf"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The user is the last admin who can log in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Remove a user
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnlyNotSelf"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The user still owns accounts, or is the last admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/users/{name}/password:
    parameters:
      - $ref: "#/components/parameters/userName"
    post:
      tags: [users]
      operationId: resetUserPassword
      summary: Generate a new password for a user
      description: |
        The user is logged out and must change the password at the next
        login. Their passkeys are removed and their API keys revoked too,
        unless `removePasskeys` or `revokeApiKeys` is false. The body may be
        empty.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                removePasskeys:
                  type: boolean
                  default: true
                revokeApiKeys:
                  type: boolean
                  default: true
      responses:
        "200":
          description: The generated password, shown only here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPassword"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnlyNotSelf"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/users/{name}/2fa/reset:
    parameters:
      - $ref: "#/components/parameters/userName"
    post:
      tags: [users]
      operationId: resetUserTwoFactor
      summary: Turn off a user's 2FA
      description: The user's sessions end.
      responses:
        "204":
          description: 2FA is off.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnlyNotSelf"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/users/{name}/passkeys:
    parameters:
      - $ref: "#/components/parameters/userName"
    delete:
      tags: [users]
      operationId: removeUserPasskeys
      summary: Remove all passkeys of a user
      description: The user's sessions end.
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnlyNotSelf"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/api-keys:
    get:
      tags: [users]
      operationId: listAllAPIKeys
      summary: Every user's API keys
      description: Names and metadata, never the keys.
      responses:
        "200":
          description: The keys, by user.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/APIKey"
                        - type: object
                          required: [user]
                          properties:
                            user:
                              type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"

  /api/api-keys/{id}:
    parameters:
      - $ref: "#/components/parameters/apiKeyID"
    delete:
      tags: [users]
      operationId: revokeAnyAPIKey
      summary: Revoke any user's API key
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/retention/rules:
    get:
      tags: [retention]
      operationId: listRetentionRules
      summary: Retention rules, with the accounts to choose from
      responses:
        "200":
          description: The rules, by owner, account and folder.
          content:
            application/json:
              schema:
                type: object
                required: [rules, accounts, minYears, defaultTimeZone]
                properties:
                  rules:
                    type: array
                    items:
                      $ref: "#/components/schemas/RetentionRule"
                  accounts:
                    type: array
                    description: Every account with its owner and folders.
                    items:
                      $ref: "#/components/schemas/RetentionAccount"
                  minYears:
                    type: integer
                    description: Rules shorter than this (business letters, §147 AO) need `force`.
                  defaultTimeZone:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"
    post:
      tags: [retention]
      operationId: createRetentionRule
      summary: Add a retention rule
      description: |
        Keeps the mail of an account, or of one folder of it, for `years`
        after the end of the year it was received or sent in. One rule per
        account and one per folder; the longest matching rule wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accountId, years]
              properties:
                accountId:
                  type: integer
                  format: int64
                folder:
                  type: string
                  description: Matched exactly; empty for every folder.
                years:
                  type: integer
                  minimum: 1
                  maximum: 100
                timeZone:
                  type: string
                  description: Of the year end; default `Europe/Berlin`.
                note:
                  type: string
                  maxLength: 500
                force:
                  type: boolean
                  description: Allows fewer years than `minYears`.
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
                    format: int64
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "409":
          description: The account or folder already has a rule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/retention/rules/{id}:
    parameters:
      - $ref: "#/components/parameters/numericID"
    delete:
      tags: [retention]
      operationId: deleteRetentionRule
      summary: Remove a retention rule
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/legal-holds:
    get:
      tags: [retention]
      operationId: listLegalHolds
      summary: Legal holds
      parameters:
        - name: released
          in: query
          description: "`1` lists released holds too."
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: The holds, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [holds]
                properties:
                  holds:
                    type: array
                    items:
                      $ref: "#/components/schemas/LegalHold"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"
    post:
      tags: [retention]
      operationId: createLegalHold
      summary: Add a legal hold
      description: |
        Every condition that is set must match. A filter is matched at once
        by search, as the owner of the mail sees it; until then the hold
        covers its whole scope. Without any condition the hold covers the
        whole archive, which needs `all`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, reason]
              properties:
                name:
                  type: string
                  maxLength: 200
                reason:
                  type: string
                  maxLength: 2000
                user:
                  type: string
                  description: Only mail in this user's accounts.
                accountId:
                  type: [integer, "null"]
                  format: int64
                filter:
                  oneOf:
                    - type: "null"
                    - $ref: "#/components/schemas/HoldFilter"
                since:
                  type: [string, "null"]
                  format: date-time
                until:
                  type: [string, "null"]
                  format: date-time
                  description: Exclusive.
                all:
                  type: boolean
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
                    format: int64
                  matched:
                    type: integer
                    format: int64
                    description: Messages the filter matched; only with a filter.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"

  /api/legal-holds/{id}/release:
    parameters:
      - $ref: "#/components/parameters/numericID"
    post:
      tags: [retention]
      operationId: releaseLegalHold
      summary: Release a legal hold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note:
                  type: string
                  maxLength: 2000
      responses:
        "204":
          description: Released.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Released already.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/retention/runs:
    get:
      tags: [retention]
      operationId: listDeletionRuns
      summary: Deletion runs, newest first
      responses:
        "200":
          description: The last 50 runs.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeletionRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"
    post:
      tags: [retention]
      operationId: createDeletionRun
      summary: Propose a deletion run
      description: |
        Matches the filter holds and lists every message whose locations, in
        every user's accounts, all have an ended retention period and no
        legal hold. Deletes nothing.
      responses:
        "201":
          description: The proposed run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "409":
          description: Another run is open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/retention/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/numericID"
    get:
      tags: [retention]
      operationId: getDeletionRun
      summary: A deletion run for review
      description: |
        Counts of the pending candidates by owner, account, folder and the
        year their period ended, and up to 1000 candidates by hash. No
        subjects or senders: the command line shows those.
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                type: object
                required: [run, groups, candidates, listed]
                properties:
                  run:
                    $ref: "#/components/schemas/DeletionRun"
                  groups:
                    type: array
                    items:
                      type: object
                      required: [owner, account, folder, year, messages]
                      properties:
                        owner:
                          type: string
                        account:
                          type: string
                        folder:
                          type: string
                        year:
                          type: integer
                        messages:
                          type: integer
                          format: int64
                  candidates:
                    type: array
                    items:
                      type: object
                      required: [sha256, size, retainUntil, state]
                      properties:
                        sha256:
                          type: string
                        size:
                          type: integer
                          format: int64
                        retainUntil:
                          type: string
                          format: date-time
                        state:
                          type: string
                          enum: [pending, deleted, kept]
                  listed:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/retention/runs/{id}/confirm:
    parameters:
      - $ref: "#/components/parameters/numericID"
    post:
      tags: [retention]
      operationId: confirmDeletionRun
      summary: Confirm a proposed run; the web server then deletes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [count]
              properties:
                count:
                  type: integer
                  description: The run's number of candidates, typed by the admin.
      responses:
        "202":
          description: Confirmed; the deletion runs in the background. Poll the run.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The run is not proposed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/retention/runs/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/numericID"
    post:
      tags: [retention]
      operationId: cancelDeletionRun
      summary: Drop a proposed run
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The run is not proposed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/audit:
    get:
      tags: [audit]
      operationId: listAuditEntries
      summary: The audit log, newest first
      description: |
        A user gets their own entries; admins get every user's, with the
        search text, account names and message hashes. Reading the log
        writes no entry.
      parameters:
        - name: since
          in: query
          description: Start, inclusive; `YYYY-MM-DD` (midnight UTC) or RFC 3339. Default 30 days ago.
          schema:
            type: string
        - name: until
          in: query
          description: End, exclusive; a plain date includes that day. Default now.
          schema:
            type: string
        - name: action
          in: query
          description: |
            A group (`login`, `search`, `read`, `export`, `accounts`, `users`,
            `profile`, `api_keys`, `sync`, `retention`) or an exact action such as
            `message.open`. Repeatable; none means all.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: user
          in: query
          description: Admins only; a current user's name.
          schema:
            type: string
        - name: actor
          in: query
          description: Admins only.
          schema:
            type: string
            enum: [session, api_key, cli]
        - name: cursor
          in: query
          description: "`nextCursor` of the previous page."
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  nextCursor:
                    type: string
                    description: Missing on the last page.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`user` or `actor` from a user who is not an admin."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`user` names no user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/status:
    get:
      tags: [accounts]
      operationId: getStatus
      security:
        - session: []
        - apiKey: [read]
      summary: Messages per account and the last sync
      description: Like `mail-archive status`.
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                type: object
                required: [uniqueMessages, accounts]
                properties:
                  uniqueMessages:
                    type: integer
                    format: int64
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIKeyScope"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      security:
        - session: []
        - apiKey: [read]
      summary: The own accounts
      description: Server settings (never the password), folders and the sync state.
      responses:
        "200":
          description: The accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accounts"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIKeyScope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Add an IMAP or smtp account
      description: |
        **IMAP** (`kind` missing or `imap`): the login is checked first; the
        first sync starts right away. If the server marks folders as trash or
        spam and they would be archived, the account is not saved: the answer
        is `409` with `suggestedExclusions`. Send the request again with
        `"confirmFolders": true`.

        **smtp** (`kind: smtp`, admins only): a name and the `addresses` the
        account receives for, nothing else; no login check. An address in
        use by another account is a `409` that names it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: IMAP account
                  allOf:
                    - $ref: "#/components/schemas/AccountInput"
                    - type: object
                      required: [name, host, username, password]
                - title: smtp account
                  allOf:
                    - $ref: "#/components/schemas/AccountInput"
                    - type: object
                      required: [kind, name, addresses]
                      properties:
                        kind:
                          const: smtp
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: An smtp account, and the user is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The name or an address is taken, or folders need confirming.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderConfirmation"
        "422":
          $ref: "#/components/responses/LoginFailed"
        "503":
          $ref: "#/components/responses/SecretKeyMissing"

  /api/accounts/{name}:
    parameters:
      - $ref: "#/components/parameters/accountName"
    patch:
      tags: [accounts]
      operationId: updateAccount
      summary: Change an account
      description: |
        Missing fields keep their value; `name` renames the account. A new
        connection or password is checked with a login first. Import accounts
        take only `name`, smtp accounts also `enabled` and `addresses`.
        `addresses` replaces the account's list; only admins may send it.

        `syncInterval` sets how often the web server's schedule syncs the
        account, without a login check. A new value below `syncIntervalMin`
        is a `400`; the stored value is accepted unchanged. Import and smtp
        accounts answer `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "`addresses`, and the user is not an admin."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The name or an address is taken, the account was changed since it
            was loaded, it was removed, or the field does not apply to its
            kind.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/LoginFailed"
        "503":
          $ref: "#/components/responses/SecretKeyMissing"
    delete:
      tags: [accounts]
      operationId: deleteAccount
      summary: Remove an account
      responses:
        "200":
          description: |
            `removed` if archived mail was kept, `deleted` if the account had
            none.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: string
                    enum: [removed, deleted]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The account is being synced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/SecretKeyMissing"

  /api/accounts/{name}/purge:
    parameters:
      - $ref: "#/components/parameters/accountName"
    get:
      tags: [accounts]
      operationId: previewAccountPurge
      summary: What deleting a removed account completely would do
      description: |
        Admins only, and only for their own accounts (other users' accounts
        are `404`; they are purged with `account purge NAME --user USER`).
        Changes nothing. `blockers` lists what keeps the account from being
        deleted: it is not removed, it is being synced, filled or imported
        into, another purge is open, retention rules cover it, or legal
        holds name it (also released ones) or cover its mail. Filter holds
        whose matches are not stored yet count as covering it.
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgePreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [accounts]
      operationId: confirmAccountPurge
      summary: Confirm deleting a removed account completely; the web server then deletes
      description: |
        Admins only, own accounts only. Matches the filter legal holds,
        then records a confirmed purge if nothing blocks it and `count` is
        the number of messages it deletes. The web server's retention job
        executes it in the background: messages also in other accounts
        stay there, messages whose last location is in this account are
        deleted like a retention deletion, then the folders and the
        account. Poll `GET /api/accounts` (`purging`) or the preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [count]
              properties:
                count:
                  type: integer
                  format: int64
                  description: The preview's `deleted`, typed by the admin.
      responses:
        "202":
          description: Confirmed; the purge runs in the background.
          content:
            application/json:
              schema:
                type: object
                required: [purge]
                properties:
                  purge:
                    type: integer
                    format: int64
                    description: The purge's ID.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/AdminOnly"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Something blocks the purge (the message names the rules and
            holds), a purge is open, the account changed, or the number of
            messages to delete is no longer `count` (then `deleted` is the
            current number; review again).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                  deleted:
                    type: integer
                    format: int64
        "503":
          description: The server runs without its retention job and cannot execute purges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/accounts/{name}/server-folders:
    parameters:
      - $ref: "#/components/parameters/accountName"
    get:
      tags: [accounts]
      operationId: listServerFolders
      summary: The account's folders on the IMAP server
      responses:
        "200":
          description: The folders, live from the server.
          content:
            application/json:
              schema:
                type: object
                required: [folders]
                properties:
                  folders:
                    type: array
                    items:
                      type: object
                      required: [name, selected]
                      properties:
                        name:
                          type: string
                        specialUse:
                          type: string
                          description: The role the server gives it, such as `\Trash`.
                        selected:
                          type: boolean
                          description: Whether the folder is archived.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NoServer"
        "502":
          description: The server could not be reached or refused the login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/SecretKeyMissing"

  /api/accounts/{name}/sync:
    parameters:
      - $ref: "#/components/parameters/accountName"
    post:
      tags: [accounts]
      operationId: syncAccount
      security:
        - session: []
        - apiKey: [sync]
      summary: Queue a sync of one account
      description: |
        Also a disabled account. A sync already waiting is upgraded, not
        queued twice. The body may be empty.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reconcile:
                  type: boolean
                  default: false
                  description: |
                    Also compare every folder with the server, except folders
                    compared in the last 5 minutes.
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queued"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIKeyScope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NoServer"
        "503":
          $ref: "#/components/responses/SecretKeyMissing"

  /api/accounts/{name}/fills:
    parameters:
      - $ref: "#/components/parameters/accountName"
    post:
      tags: [accounts]
      operationId: startFill
      summary: Copy an IMAP mailbox into an smtp account, once or on a schedule
      description: |
        A fill brings in the mail from before journaling: the messages of
        the IMAP mailbox go into the smtp account's folder `JOURNAL`, next to
        the journaled mail, whatever their IMAP folder. They have no
        envelope, and their location names the fill (`fill`). A message
        filed in several IMAP folders is stored once. A message is copied when
        its INTERNALDATE is before the cut-off (`before`) plus one hour,
        unless the account received a message with the same Message-ID over
        SMTP. Such a fill runs once.

        With `"keepRunning": true` the fill is recurring: it has no cut-off
        and copies a message once its INTERNALDATE is two hours old, unless
        the account received it over SMTP. The web server runs it again
        every `interval` (default its sync interval), but not in the first
        70 minutes after it started; each run continues every IMAP folder
        where the last one stopped. Moves and deletions in the mailbox are
        ignored. A trash or spam folder that appears later is skipped
        (`unconfirmedFolders`) unless `includedFolders` names it.

        The login is checked first. If the server marks folders as trash or
        spam and the fill would copy them, nothing is saved: the answer is
        `409` with `suggestedExclusions`; send the request again with
        `"confirmFolders": true`. The web server then runs the fill in the
        background, one at a time; `GET /api/accounts` shows its progress
        under `fill`, and the account's `sync.state` is `queued` or
        `running` meanwhile. The password is kept, encrypted, only while the
        fill runs or keeps running. Also for a disabled account; a recurring
        fill does not run again while the account is disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FillInput"
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillID"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            Not an smtp account, a fill of it is running, or folders need
            confirming.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderConfirmation"
        "422":
          $ref: "#/components/responses/LoginFailed"
        "503":
          $ref: "#/components/responses/SecretKeyMissing"

  /api/accounts/{name}/fills/{id}:
    parameters:
      - $ref: "#/components/parameters/accountName"
      - $ref: "#/components/parameters/numericID"
    patch:
      tags: [accounts]
      operationId: changeFill
      summary: Switch a fill to recurring, stop it or change its interval
      description: |
        - `{"keepRunning": true, "password": "…", "interval"?, "confirmFolders"?}`
          switches a fill that ended on: it keeps running from now on, and its
          first run is queued (`202`). The password is required and checked
          first. That run scans the fill's IMAP folders again from the start
          and copies what the cut-off left out. A fill from before fills
          wrote into `JOURNAL` first copies its messages into `JOURNAL`, as
          locations, without new files. Trash and spam folders it has not copied yet need
          `confirmFolders`, as for a new fill.
        - `{"keepRunning": false}` stops a recurring fill, like `cancel`.
        - `{"interval": "12h"}` changes the interval of a recurring fill
          that keeps running (`204`).

        A new password for a recurring fill whose login fails: stop it and
        resume it with the new password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FillChange"
      responses:
        "202":
          description: Switched on; its first run is queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillID"
        "204":
          description: Stopped, or the interval changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            Not an smtp account; the fill runs, already keeps running, or
            (to stop it or change its interval) does not; another fill of
            the account runs; or folders need confirming.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderConfirmation"
        "422":
          $ref: "#/components/responses/LoginFailed"
        "503":
          $ref: "#/components/responses/SecretKeyMissing"

  /api/accounts/{name}/fills/folders:
    parameters:
      - $ref: "#/components/parameters/accountName"
    post:
      tags: [accounts]
      operationId: listFillFolders
      summary: The folders of a fill's IMAP server
      description: |
        Before a fill: the folders of the IMAP mailbox, live from the server,
        and those it marks as trash or spam, to exclude or confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FillServer"
      responses:
        "200":
          description: The folders.
          content:
            application/json:
              schema:
                type: object
                required: [folders, suggestedExclusions]
                properties:
                  folders:
                    type: array
                    items:
                      type: object
                      required: [name, selected]
                      properties:
                        name:
                          type: string
                        specialUse:
                          type: string
                          description: The role the server gives it, such as `\Junk`.
                        selected:
                          type: boolean
                          description: Always true; a new fill copies every folder by default.
                  suggestedExclusions:
                    type: array
                    description: The folders the server marks as trash or spam.
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/LoginFailed"
        "503":
          $ref: "#/components/responses/SecretKeyMissing"

  /api/accounts/{name}/fills/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/accountName"
      - $ref: "#/components/parameters/numericID"
    post:
      tags: [accounts]
      operationId: resumeFill
      summary: Continue a fill
      description: |
        A fill that failed, partly failed or was cancelled continues where it
        stopped. Its password was wiped when it ended, so it is given again
        and checked. A stopped recurring fill keeps running again, starting
        with a run; one that still keeps running is not resumed (`409`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  writeOnly: true
      responses:
        "202":
          description: Resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillID"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not an smtp account, the fill is running, ended well or keeps running, or another fill of the account runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/LoginFailed"
        "503":
          $ref: "#/components/responses/SecretKeyMissing"

  /api/accounts/{name}/fills/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/accountName"
      - $ref: "#/components/parameters/numericID"
    post:
      tags: [accounts]
      operationId: cancelFill
      summary: Stop a running or recurring fill
      description: |
        A running fill stops after its current batch; a recurring fill no
        longer keeps running. Its password is wiped. What it copied stays;
        `resume` continues it.
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not an smtp account, or the fill neither runs nor keeps running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/SecretKeyMissing"

  /api/sync:
    post:
      tags: [accounts]
      operationId: syncAll
      security:
        - session: []
        - apiKey: [sync]
      summary: Queue a sync of all own enabled IMAP accounts
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Queued"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIKeyScope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/SecretKeyMissing"

  /api/messages:
    get:
      tags: [messages]
      operationId: listMessages
      security:
        - session: []
        - apiKey: [read]
      summary: List or search messages
      description: Newest first. All filters combine.
      parameters:
        - name: q
          in: query
          description: Full-text query over subject, sender and body.
          schema:
            type: string
        - name: account
          in: query
          description: Only messages found in this account.
          schema:
            type: string
        - name: folder
          in: query
          description: Only messages found in this folder.
          schema:
            type: string
        - name: from
          in: query
          description: Part of the sender's name or address, in any case.
          schema:
            type: string
            maxLength: 200
        - name: to
          in: query
          description: |
            Part of a name or address in To or Cc, in any case, or of an
            envelope recipient of the user's smtp accounts.
          schema:
            type: string
            maxLength: 200
        - name: attachment
          in: query
          description: Part of an attachment's file name, in any case. Implies `has=attachment`.
          schema:
            type: string
            maxLength: 200
        - name: has
          in: query
          description: Only messages with at least one attachment.
          schema:
            type: string
            enum: [attachment]
        - name: after
          in: query
          description: Inclusive. `YYYY-MM-DD` (midnight UTC) or RFC 3339.
          schema:
            type: string
        - name: before
          in: query
          description: Exclusive. `YYYY-MM-DD` (midnight UTC) or RFC 3339.
          schema:
            type: string
        - name: group
          in: query
          description: "`1`: one row per conversation, the newest message of it that matches."
          schema:
            type: string
            enum: ["0", "1"]
        - name: thread
          in: query
          description: Only the messages of this conversation (a `thread` value).
          schema:
            type: string
            maxLength: 2000
        - name: gone
          in: query
          description: Only messages no longer on any server.
          schema:
            type: string
            enum: ["1", "true", "0", "false"]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: One page of messages.
          content:
            application/json:
              schema:
                type: object
                required: [messages, nextCursor]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/MessageSummary"
                  nextCursor:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIKeyScope"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/messages/{sha}:
    parameters:
      - $ref: "#/components/parameters/sha"
    get:
      tags: [messages]
      operationId: getMessage
      security:
        - session: []
        - apiKey: [read]
      summary: One message
      description: Headers, plain text, attachment list and every location.
      responses:
        "200":
          description: The message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIKeyScope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/messages/{sha}/conversation:
    parameters:
      - $ref: "#/components/parameters/sha"
    get:
      tags: [messages]
      operationId: getConversation
      security:
        - session: []
        - apiKey: [read]
      summary: The conversation of a message
      description: Oldest first, at most the newest 200.
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                type: object
                required: [messages, total, truncated]
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConversationEntry"
                  total:
                    type: integer
                  truncated:
                    type: boolean
                    description: Older messages were left out.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIKeyScope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/messages/{sha}/html:
    parameters:
      - $ref: "#/components/parameters/sha"
    get:
      tags: [messages]
      operationId: getMessageHTML
      security:
        - session: []
        - apiKey: [read]
      summary: The HTML body
      description: |
        For a sandboxed iframe. The Content-Security-Policy blocks scripts and
        remote content; remote images only with `images=1`.
      parameters:
        - name: images
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: The HTML body.
          content:
            text/html:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIKeyScope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          description: No such message, or it has no HTML body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/messages/{sha}/raw:
    parameters:
      - $ref: "#/components/parameters/sha"
    get:
      tags: [messages]
      operationId: getMessageRaw
      security:
        - session: []
        - apiKey: [read]
      summary: The original message file
      responses:
        "200":
          description: The `.eml` file, as a download.
          content:
            message/rfc822:
              schema:
                type: string
                contentMediaType: message/rfc822
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIKeyScope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/messages/{sha}/parts/{n}:
    parameters:
      - $ref: "#/components/parameters/sha"
      - name: n
        in: path
        required: true
        description: The `index` of a part in `GET /api/messages/{sha}`.
        schema:
          type: integer
          minimum: 0
    get:
      tags: [messages]
      operationId: getMessagePart
      security:
        - session: []
        - apiKey: [read]
      summary: One attachment
      description: |
        PNG, JPEG, GIF and WebP are shown inline; everything else is a
        download as `application/octet-stream`.
      responses:
        "200":
          description: The attachment.
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
            image/*:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/APIKeyScope"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: mail_archive_session
      description: |
        The session cookie set by the login endpoints. Over HTTPS it is
        named `__Host-mail_archive_session`.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: ma_…
      description: |
        An API key from the profile, as `Authorization: Bearer ma_…`. The
        scope list of an operation names the key scope it needs.

  parameters:
    numericID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    apiKeyID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    sha:
      name: sha
      in: path
      required: true
      description: The SHA-256 of the message file.
      schema:
        type: string
        pattern: "^[0-9a-f]{64}$"
    accountName:
      name: name
      in: path
      required: true
      description: The account name.
      schema:
        type: string
    userName:
      name: name
      in: path
      required: true
      description: The user name.
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminOnly:
      description: The user is not an admin.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminOnlyNotSelf:
      description: The user is not an admin, or the target is the admin themselves.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found, or not the user's.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Changed meanwhile; reload and try again.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoServer:
      description: The account is an import or smtp account, or was removed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LoginFailed:
      description: The IMAP server refused the login.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many attempts.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Retry"
    PasskeysOff:
      description: Passkeys need `MAIL_ARCHIVE_PUBLIC_URL` on the server.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    APIKeyScope:
      description: |
        With an API key: the key lacks the scope this route needs (`scope`
        names it), or the key's owner must change the password or set up
        2FA first (as for a session).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SecretKeyMissing:
      description: This needs `MAIL_ARCHIVE_SECRET_KEY` on the server.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        passwordChangeRequired:
          type: boolean
          description: In a `403`, the user must change the generated password first.
        twoFactorSetupRequired:
          type: boolean
          description: In a `403`, the user must set up 2FA first.
    AuditEntry:
      type: object
      required: [id, at, actor, action, target, details]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actor:
          type: string
          enum: [session, api_key, cli]
        user:
          type: string
          description: The user's name at the time; missing for command line entries and unknown users.
        apiKey:
          type: string
          description: The name of the API key, for entries with actor `api_key`.
        action:
          type: string
          examples: [message.search, auth.login]
        target:
          type: [object, "null"]
          required: [type, id]
          properties:
            type:
              type: string
              enum: [message, account, user]
            id:
              type: string
            name:
              type: string
            subject:
              type: string
              description: The subject of a message, only if the viewer has the message too.
        clientIp:
          type: string
        userAgent:
          type: string
        details:
          type: object
          description: The search parameters, the login method and reason, and the other values named in the docs.

    Retry:
      type: object
      required: [error, retryAfter]
      properties:
        error:
          type: string
        retryAfter:
          type: integer
          description: Seconds.

    User:
      type: object
      required: [name, admin, mustChangePassword, twoFactorEnabled, twoFactorRequired, language, locale]
      properties:
        name:
          type: string
        admin:
          type: boolean
        mustChangePassword:
          type: boolean
          description: The user logged in with a generated password and must choose their own.
        twoFactorEnabled:
          type: boolean
        twoFactorRequired:
          type: boolean
        language:
          $ref: "#/components/schemas/Language"
        locale:
          $ref: "#/components/schemas/Locale"
    Language:
      type: string
      maxLength: 35
      pattern: "^(auto|[a-z]{2,3}(-[A-Za-z0-9]{2,8})*)$"
      description: |
        The language of the web UI. `auto` follows the browser. The UI has
        `en` and `de` today and treats other values like `auto`.
    Locale:
      type: string
      maxLength: 35
      pattern: "^(auto|[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*)$"
      description: |
        A BCP 47 tag for dates and numbers, or `auto` for the browser's. The
        UI treats a tag it cannot use like `auto`.
    Session:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    NoSession:
      type: object
      required: [error, setupRequired]
      properties:
        error:
          type: string
        setupRequired:
          type: boolean
          description: No user exists yet.
        passkeyOrigin:
          type: string
          description: Where passkey logins work; missing when they are off.
    TwoFactorChallenge:
      type: object
      required: [twoFactorRequired, challenge]
      properties:
        twoFactorRequired:
          type: boolean
          const: true
        challenge:
          type: string
    Ceremony:
      type: object
      required: [token, publicKey]
      properties:
        token:
          type: string
        publicKey:
          type: object
          description: WebAuthn options; binary values in base64url.
    CeremonyResult:
      type: object
      required: [token, credential]
      additionalProperties: false
      properties:
        token:
          type: string
        credential:
          type: object
          description: The browser's answer, in JSON.
    UnknownPasskey:
      type: object
      required: [error]
      properties:
        error:
          type: string
        unknownCredential:
          type: boolean
        credentialId:
          type: string
        rpId:
          type: string

    TwoFactor:
      type: object
      required: [enabled, required, admin, setupPending]
      properties:
        enabled:
          type: boolean
        required:
          type: boolean
        admin:
          type: boolean
        setupPending:
          type: boolean
        secret:
          type: string
          description: Only in the answer of the setup.
        otpauthUri:
          type: string
          description: Only in the answer of the setup.
        qrDataUrl:
          type: string
          description: A PNG data URL; only in the answer of the setup.
    CodeInput:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          items:
            type: string
    Passkey:
      type: object
      required: [id, name, createdAt, lastUsedAt]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time

    APIKeyScope:
      type: string
      enum: [read, sync]
      description: |
        `read`: messages, search, conversations, downloads, accounts and
        status. `sync`: starting syncs. Neither implies the other.
    APIKey:
      type: object
      required: [id, name, hint, scopes, createdAt, expiresAt, lastUsedAt, revokedAt, state]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        hint:
          type: string
          description: The last 4 characters of the key.
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/APIKeyScope"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: [string, "null"]
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
        state:
          type: string
          enum: [active, expired, revoked]

    AdminUser:
      type: object
      required: [name, admin, locked, mustChangePassword, twoFactorEnabled, passkeys, apiKeys, accounts, failingAccounts, createdAt, lastLoginAt, self]
      properties:
        name:
          type: string
        admin:
          type: boolean
        locked:
          type: boolean
        mustChangePassword:
          type: boolean
        twoFactorEnabled:
          type: boolean
        passkeys:
          type: integer
        apiKeys:
          type: integer
          description: API keys that are neither revoked nor expired.
        accounts:
          type: integer
        failingAccounts:
          type: integer
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: [string, "null"]
          format: date-time
        self:
          type: boolean
          description: The logged-in admin, whose own row cannot be changed here.
    GeneratedPassword:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
        password:
          type: string

    AccountKind:
      type: string
      enum: [imap, import, smtp]
      description: "`import` for mail imported from files, `smtp` for mail a mail server delivers over SMTP."
    Health:
      type: string
      enum: [ok, failing, stale]
      description: >-
        `failing` when the last `alertAfter` syncs failed; `stale` when no
        sync succeeded within two of the account's sync intervals (at least
        one interval plus an hour), counted from the last success or the
        account's creation, but never while the account is running or
        queued (a running sync counts from its start). Accounts the schedule
        does not sync are never stale.
    AccountStatus:
      type: object
      required: [name, kind, enabled, folders, messages, lastRunAt, lastStatus, lastError, failureStreak, health, syncEvery, nextAt, goneMessages]
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/AccountKind"
        enabled:
          type: boolean
        folders:
          type: integer
        messages:
          type: integer
          format: int64
        lastRunAt:
          type: [string, "null"]
          format: date-time
        lastStatus:
          type: [string, "null"]
        lastError:
          type: [string, "null"]
        failureStreak:
          type: integer
        health:
          $ref: "#/components/schemas/Health"
        syncEvery:
          $ref: "#/components/schemas/SyncEvery"
        nextAt:
          $ref: "#/components/schemas/NextAt"
        goneMessages:
          type: integer
          format: int64
    SyncEvery:
      type: [string, "null"]
      description: >-
        How often the schedule syncs the account, a Go duration such as
        `1h0m0s`: its own interval or the server's default, at least
        `syncIntervalMin`. Null when the schedule does not sync it: not on
        the schedule (`manual`), the schedule off, removed, import or smtp.
    NextAt:
      type: [string, "null"]
      format: date-time
      description: >-
        When the schedule syncs the account next. In the past while it waits
        for its turn. Null without `syncEvery` or when disabled.
    Accounts:
      type: object
      required: [accounts, manage, syncInterval, syncIntervalMin, reconcileInterval, alertAfter, smtp]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        manage:
          type: boolean
          description: False without `MAIL_ARCHIVE_SECRET_KEY`; accounts can then only be browsed.
        syncInterval:
          type: string
          description: >-
            The server's `MAIL_ARCHIVE_SYNC_INTERVAL`, a Go duration such as
            `6h0m0s`: the default for accounts without their own interval.
            Empty when the schedule is off. Not the same as an account's
            `syncInterval`.
        syncIntervalMin:
          type: string
          description: >-
            The server's `MAIL_ARCHIVE_SYNC_INTERVAL_MIN`, such as `5m0s`: the
            floor for every account's interval. Empty when the server cannot
            sync (no `MAIL_ARCHIVE_SECRET_KEY`).
        reconcileInterval:
          type: string
          description: A Go duration; empty when folders are only reconciled on request.
        alertAfter:
          type: integer
          description: Failed syncs in a row that make an account failing.
        otherFailing:
          type: integer
          description: For admins only, the number of failing accounts of other users.
        smtp:
          type: [object, "null"]
          additionalProperties: false
          description: >-
            Null when the SMTP server is off (`MAIL_ARCHIVE_SMTP_LISTEN`
            empty): smtp accounts then receive nothing. An empty object when
            it is on.
    Account:
      type: object
      required: [name, kind, enabled, removed, purging, purge, host, port, tls, username, includedFolders, excludedFolders, syncInterval, folders, sync, goneMessages, lastReconciledAt, addresses, lastReceivedAt, fill, fills, firstReceived]
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/AccountKind"
        enabled:
          type: boolean
        removed:
          type: boolean
        purging:
          type: boolean
          description: The removed account is being deleted completely (a confirmed purge).
        purge:
          description: >-
            The progress of the account's confirmed purge while it is being
            deleted completely; null otherwise.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/AccountPurge"
        host:
          type: string
        port:
          type: integer
        tls:
          type: string
          description: "`tls`, `starttls` or `none`; empty for import and smtp accounts."
        username:
          type: string
        includedFolders:
          type: array
          items:
            type: string
        excludedFolders:
          type: array
          items:
            type: string
        syncInterval:
          $ref: "#/components/schemas/OwnSyncInterval"
        folders:
          type: array
          items:
            $ref: "#/components/schemas/Folder"
        sync:
          $ref: "#/components/schemas/SyncState"
        goneMessages:
          type: integer
          format: int64
          description: Messages whose locations in this account are all gone from the server.
        lastReconciledAt:
          type: [string, "null"]
          format: date-time
        addresses:
          type: array
          description: The addresses an smtp account receives for.
          items:
            type: string
        lastReceivedAt:
          type: [string, "null"]
          format: date-time
          description: When an smtp account last accepted a message.
        fill:
          description: The latest fill of an smtp account; null without one and for other kinds.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Fill"
        fills:
          type: array
          description: >-
            The recurring fills of an smtp account (also stopped ones) and
            its latest fill, newest first; empty for other kinds.
          items:
            $ref: "#/components/schemas/Fill"
        firstReceived:
          description: >-
            The first message an smtp account received that is still
            stored, a check for a fill's cut-off; null without one and for
            other kinds.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FirstReceived"
    AccountPurge:
      type: object
      required: [id, expected, locations, deleted, kept]
      properties:
        id:
          type: integer
          format: int64
        expected:
          type: integer
          description: The messages it deletes, as confirmed.
        locations:
          type: integer
          format: int64
          description: Locations removed so far.
        deleted:
          type: integer
          description: Messages deleted so far.
        kept:
          type: integer
          description: Messages kept so far, because they are also in other accounts.
    PurgePreview:
      type: object
      required: [account, kind, locations, messages, deleted, deletedBytes, kept, keptIn, grace, blockers, purge]
      properties:
        account:
          type: string
        kind:
          $ref: "#/components/schemas/AccountKind"
        locations:
          type: integer
          format: int64
          description: Locations removed (every location in the account's folders).
        messages:
          type: integer
          format: int64
          description: Distinct messages in the account.
        deleted:
          type: integer
          format: int64
          description: Messages only in this account; they are deleted. The number to type.
        deletedBytes:
          type: integer
          format: int64
        kept:
          type: integer
          format: int64
          description: Messages also in other accounts; they stay there.
        keptIn:
          type: array
          description: Where the kept messages also are (counts only).
          items:
            type: object
            required: [owner, account, messages]
            properties:
              owner:
                type: string
                description: Empty for an account without owner.
              account:
                type: string
              messages:
                type: integer
                format: int64
        grace:
          type: string
          description: >-
            MAIL_ARCHIVE_RETENTION_FILE_GRACE as a Go duration ("168h0m0s"):
            how long the files of deleted messages are kept. Empty without
            the retention job.
        blockers:
          type: object
          required: [notRemoved, syncing, purgeOpen, rules, holds, messages]
          properties:
            notRemoved:
              type: boolean
            syncing:
              type: boolean
              description: The account is being synced, filled or imported into.
            purgeOpen:
              type: boolean
              description: Another account's purge is confirmed and not finished.
            rules:
              type: array
              items:
                type: object
                required: [id, folder, years]
                properties:
                  id:
                    type: integer
                    format: int64
                  folder:
                    type: string
                    description: Empty for a rule on all folders.
                  years:
                    type: integer
            holds:
              type: array
              items:
                type: object
                required: [id, name, released, namesAccount]
                properties:
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
                  released:
                    type: boolean
                  namesAccount:
                    type: boolean
                    description: The hold names the account; otherwise it covers some of its mail.
            messages:
              type: array
              description: The blockers in words, naming the rules and holds.
              items:
                type: string
        purge:
          description: The account's confirmed purge while it is being executed; null without one.
          oneOf:
            - type: "null"
            - type: object
              required: [id, state, expected, locations, deleted, kept]
              properties:
                id:
                  type: integer
                  format: int64
                state:
                  type: string
                  enum: [confirmed]
                expected:
                  type: integer
                locations:
                  type: integer
                  format: int64
                deleted:
                  type: integer
                kept:
                  type: integer
    Folder:
      type: object
      required: [name, messages, lastSyncedAt, lastReconciledAt, delimiter]
      properties:
        name:
          type: string
        messages:
          type: integer
          format: int64
        lastSyncedAt:
          type: [string, "null"]
          format: date-time
        lastReconciledAt:
          type: [string, "null"]
          format: date-time
        delimiter:
          type: [string, "null"]
          maxLength: 1
          description: >-
            The IMAP hierarchy delimiter of the folder ("/" or "."), "" if the
            server has none, null until the folder's first sync since the
            upgrade. Always "/" for import and smtp accounts.
    OwnSyncInterval:
      type: string
      description: >-
        The account's own sync interval: `default` (the server's
        `syncInterval`), `manual` (not on the schedule; the Sync button,
        Sync all and a plain `sync` still sync it) or a Go duration of whole
        minutes from 5 minutes to 720 hours, such as `30m0s`. Always
        `default` for import and smtp accounts.
      examples: [default, manual, 30m0s]
    SyncState:
      type: object
      required: [state, lastRun, failureStreak, failingSince, health, syncEvery, nextAt]
      properties:
        state:
          type: string
          enum: [idle, queued, running]
        lastRun:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/SyncRun"
        failureStreak:
          type: integer
        failingSince:
          type: [string, "null"]
          format: date-time
        health:
          $ref: "#/components/schemas/Health"
        syncEvery:
          $ref: "#/components/schemas/SyncEvery"
        nextAt:
          $ref: "#/components/schemas/NextAt"
    SyncRun:
      type: object
      required: [startedAt, finishedAt, status, fetched, new, reconciledFolders, gone, back, flagsChanged]
      properties:
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        status:
          type: string
          enum: [running, ok, partial, failed]
        fetched:
          type: integer
        new:
          type: integer
        error:
          type: string
        reconciledFolders:
          type: integer
        gone:
          type: integer
        back:
          type: integer
        flagsChanged:
          type: integer
    AccountInput:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [imap, smtp]
          description: "`POST` only; default `imap`. smtp accounts need an admin."
        name:
          type: string
        host:
          type: string
        port:
          type: integer
          description: Default 993 with `tls`, else 143.
        tls:
          type: string
          enum: [tls, starttls, none]
        username:
          type: string
        password:
          type: string
        enabled:
          type: boolean
        excludedFolders:
          type: array
          description: Replaces the folder selection; everything except these folders is archived.
          items:
            type: string
        syncInterval:
          type: string
          description: >-
            IMAP accounts only: `default`, `manual` or a Go duration of whole
            minutes such as `30m` or `1h30m`, from 5 minutes (or
            `syncIntervalMin`, if higher) to 720 hours. A value equal to the
            stored one is accepted and changes nothing, even below a raised
            `syncIntervalMin`.
        confirmFolders:
          type: boolean
          description: "`POST` only: save even if trash or spam folders would be archived."
        addresses:
          type: array
          minItems: 1
          description: >-
            smtp accounts only, admins only: the addresses the account receives
            for, without "+". In a `PATCH` the complete new list.
          items:
            type: string
    FolderConfirmation:
      type: object
      required: [error]
      properties:
        error:
          type: string
        suggestedExclusions:
          type: array
          items:
            type: string
    FillServer:
      type: object
      additionalProperties: false
      required: [host, username, password]
      properties:
        host:
          type: string
        port:
          type: integer
          description: Default 993 with `tls`, else 143.
        tls:
          type: string
          enum: [tls, starttls, none]
          default: tls
        username:
          type: string
        password:
          type: string
          writeOnly: true
    FillInput:
      type: object
      additionalProperties: false
      required: [host, username, password]
      properties:
        host:
          type: string
        port:
          type: integer
          description: Default 993 with `tls`, else 143.
        tls:
          type: string
          enum: [tls, starttls, none]
          default: tls
        username:
          type: string
        password:
          type: string
          writeOnly: true
          description: Kept, encrypted, only while the fill runs.
        includedFolders:
          type: array
          description: Only copy these folders; empty copies all.
          items:
            type: string
        excludedFolders:
          type: array
          description: Skip these folders.
          items:
            type: string
        folderPrefix:
          type: string
          deprecated: true
          description: >-
            No longer supported: fills write into `JOURNAL`. A non-empty
            value is answered `400`.
        before:
          type: string
          format: date-time
          description: >-
            The cut-off; default now. Messages from an hour after it on are
            left to journaling. Not with `keepRunning`.
        confirmFolders:
          type: boolean
          default: false
          description: Copy trash and spam folders too, if the filters select them.
        keepRunning:
          type: boolean
          default: false
          description: >-
            Keep importing: a recurring fill copies what is two hours old and
            runs again every `interval`.
        interval:
          type: string
          default: default
          description: >-
            With `keepRunning`: `default` (the server's
            `MAIL_ARCHIVE_SYNC_INTERVAL`) or a duration of whole minutes from
            5m to 720h, not below `MAIL_ARCHIVE_SYNC_INTERVAL_MIN`.
    FillChange:
      type: object
      additionalProperties: false
      properties:
        keepRunning:
          type: boolean
          description: "`true` switches an ended fill on; `false` stops a recurring one."
        password:
          type: string
          writeOnly: true
          description: 'Required with `"keepRunning": true`; only with it.'
        interval:
          type: string
          description: "`default` or a duration; alone, it changes the interval of a fill that keeps running."
        confirmFolders:
          type: boolean
          default: false
          description: 'With `"keepRunning": true`, copy trash and spam folders the fill has not copied yet.'
    FillID:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
    Fill:
      type: object
      description: A copy of an IMAP mailbox into an smtp account. Never carries the password.
      required: [id, status, host, port, tls, username, includedFolders, excludedFolders, folderPrefix, before, keepRunning, recurringSince,
                 runStartedAt, interval, every, nextAt, health, unconfirmedFolders, error, createdAt, finishedAt, folders]
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [running, ok, partial, failed, cancelled]
          description: >-
            `partial`: some folders failed (see their `error`). For a
            recurring fill, the state of its current or last run;
            `cancelled` once it was stopped.
        host:
          type: string
        port:
          type: integer
        tls:
          type: string
        username:
          type: string
        includedFolders:
          type: array
          items:
            type: string
        excludedFolders:
          type: array
          items:
            type: string
        folderPrefix:
          type: string
          description: >-
            Only for fills started before fills wrote into `JOURNAL`: they
            write into `PREFIX/<IMAP folder>`. Empty for newer fills.
        before:
          type: [string, "null"]
          format: date-time
          description: The cut-off; null for a fill that was recurring from the start.
        keepRunning:
          type: boolean
          description: The fill is recurring and has not been stopped.
        recurringSince:
          type: [string, "null"]
          format: date-time
          description: >-
            When the fill became recurring; null for a one-time fill. A
            recurring fill copies what is two hours old, and its `status`,
            `error` and counts are those of its current or last run.
        runStartedAt:
          type: [string, "null"]
          format: date-time
          description: The start of the current or last run of a recurring fill.
        interval:
          type: [string, "null"]
          description: The fill's own interval, `default` or a duration like `12h0m0s`; null for a one-time fill.
        every:
          type: [string, "null"]
          description: >-
            How often the web server runs the fill, with the server's
            default and floor applied; null unless it keeps running and
            the schedule is on.
        nextAt:
          type: [string, "null"]
          format: date-time
          description: The next run (in the past when due); null when `every` is.
        health:
          description: The health of a fill that keeps running, like an account's sync health; null otherwise.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/FillHealth"
        unconfirmedFolders:
          type: array
          description: >-
            Trash and spam folders that appeared after the fill started; its
            runs skip them.
          items:
            type: string
        error:
          type: string
          description: Why the fill (or a recurring fill's last run) failed; empty otherwise.
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        folders:
          type: array
          description: The folders started so far.
          items:
            $ref: "#/components/schemas/FillFolder"
    FillHealth:
      type: object
      required: [state, failureStreak, failingSince, lastSuccessAt]
      properties:
        state:
          type: string
          enum: [ok, failing, stale]
          description: >-
            `failing`: the last `alertAfter` runs failed; `stale`: no run
            succeeded within two intervals (at least one plus an hour).
        failureStreak:
          type: integer
        failingSince:
          type: [string, "null"]
          format: date-time
        lastSuccessAt:
          type: [string, "null"]
          format: date-time
    FillFolder:
      type: object
      required: [source, folder, done, error, scanned, imported, new, afterCutoff, journaled, present, deleted, waiting]
      properties:
        source:
          type: string
          description: The IMAP folder.
        folder:
          type: string
          description: The archive folder, `JOURNAL` (or `PREFIX/<source>` for an earlier fill).
        done:
          type: boolean
        error:
          type: string
        scanned:
          type: integer
          description: Messages whose header was read.
        imported:
          type: integer
          description: Messages copied.
        new:
          type: integer
          description: Of those, messages new to the archive.
        afterCutoff:
          type: integer
          description: Left to journaling (from an hour after the cut-off on).
        journaled:
          type: integer
          description: Skipped; the account received the same Message-ID over SMTP.
        present:
          type: integer
          description: >-
            Already in the archive folder (a resumed fill), or copied by
            this fill before (a recurring fill: a moved message).
        deleted:
          type: integer
          description: Deleted by retention before; not stored again.
        waiting:
          type: integer
          description: Recurring fills only, younger than two hours; the next run copies them.
    FirstReceived:
      type: object
      required: [at, subject]
      properties:
        at:
          type: string
          format: date-time
        subject:
          type: string
    Queued:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer
    SyncHealth:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        failing:
          type: array
          description: IDs of failing accounts (an smtp account when one of its recurring fills fails).
          items:
            type: integer
            format: int64
        stale:
          type: array
          description: IDs of stale accounts (an smtp account when one of its recurring fills is stale).
          items:
            type: integer
            format: int64

    MessageSummary:
      type: object
      required: [id, size, subject, from, sentAt, sortAt, hasAttachment]
      properties:
        id:
          type: string
          description: The SHA-256 of the message file.
        size:
          type: integer
          format: int64
        subject:
          type: string
        from:
          type: string
        sentAt:
          type: [string, "null"]
          format: date-time
        sortAt:
          type: string
          format: date-time
        snippet:
          type: string
          description: For searches. Matches are marked with U+E000 (start) and U+E001 (end).
        hasAttachment:
          type: boolean
        thread:
          type: string
          description: The conversation key, for `thread=`. In grouped rows and messages.
        count:
          type: integer
          description: In grouped rows, the number of matching messages of the conversation.
    Message:
      allOf:
        - $ref: "#/components/schemas/MessageSummary"
        - type: object
          required: [messageId, to, cc, dateHeader, text, hasHtml, truncated, parts, locations]
          properties:
            messageId:
              type: string
            inReplyTo:
              type: string
              description: The Message-ID it answers, without angle brackets.
            to:
              type: string
            cc:
              type: string
            dateHeader:
              type: string
            text:
              type: string
            hasHtml:
              type: boolean
            truncated:
              type: boolean
            parts:
              type: array
              items:
                $ref: "#/components/schemas/Part"
            locations:
              type: array
              items:
                $ref: "#/components/schemas/Location"
            retainUntil:
              type: [string, "null"]
              format: date-time
              description: |
                The latest end of the retention period over the user's
                locations; null when one of them has no rule (kept for ever).
            onHold:
              type: boolean
              description: One of the locations is on legal hold. Only for admins.
    Part:
      type: object
      required: [index, contentType, size, attachment, inline]
      properties:
        index:
          type: integer
        contentType:
          type: string
        filename:
          type: string
        contentId:
          type: string
        size:
          type: integer
          format: int64
        attachment:
          type: boolean
        inline:
          type: boolean
    Location:
      type: object
      required: [account, folder, uid, flags, internalDate, superseded, goneAt, lastSeenAt, envelope, filled, fill, import, retainUntil]
      properties:
        account:
          type: string
        folder:
          type: string
        uid:
          type: integer
          format: int64
        flags:
          type: array
          items:
            type: string
        internalDate:
          type: [string, "null"]
          format: date-time
        superseded:
          type: boolean
          description: From before the folder's UIDVALIDITY changed.
        goneAt:
          type: [string, "null"]
          format: date-time
          description: When a reconcile found the location missing on the server.
        lastSeenAt:
          type: string
          format: date-time
        envelope:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Envelope"
        filled:
          type: boolean
          description: >-
            A location in an smtp account without an envelope: imported by
            a fill or from files, so BCC recipients are unknown.
        fill:
          description: >-
            The fill a filled location came from: the IMAP mailbox it was
            imported from. Null for other locations, and when it is not known.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LocationFill"
        import:
          description: >-
            The import of files (`import --journal`) a filled location came
            from: its label. Null for other locations, and when it is not
            known.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LocationImport"
        retainUntil:
          type: [string, "null"]
          format: date-time
          description: When the retention period ends; null without a rule (kept for ever).
        onHold:
          type: boolean
          description: An active legal hold covers it. Only for admins.
    LocationFill:
      type: object
      required: [id, username, host]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        host:
          type: string
    LocationImport:
      type: object
      required: [id, label]
      properties:
        id:
          type: integer
          format: int64
        label:
          type: string
    DeletionRun:
      type: object
      required: [id, state, createdAt, createdBy, candidates, bytes, confirmedAt, confirmedBy, finishedAt, deleted, kept]
      properties:
        id:
          type: integer
          format: int64
        state:
          type: string
          enum: [proposed, confirmed, done, cancelled]
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: Empty for the command line.
        candidates:
          type: integer
        bytes:
          type: integer
          format: int64
        confirmedAt:
          type: [string, "null"]
          format: date-time
        confirmedBy:
          type: string
        finishedAt:
          type: [string, "null"]
          format: date-time
        deleted:
          type: integer
        kept:
          type: integer
    RetentionRule:
      type: object
      required: [id, accountId, account, accountKind, accountRemoved, owner, folder, years, timeZone, note, createdAt, createdBy]
      properties:
        id:
          type: integer
          format: int64
        accountId:
          type: integer
          format: int64
        account:
          type: string
        accountKind:
          type: string
          enum: [imap, import, smtp]
        accountRemoved:
          type: boolean
        owner:
          type: string
        folder:
          type: string
          description: Empty for every folder of the account.
        years:
          type: integer
        timeZone:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          description: Empty for the command line.
    RetentionAccount:
      type: object
      required: [id, name, kind, removed, owner, folders]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum: [imap, import, smtp]
        removed:
          type: boolean
        owner:
          type: string
        folders:
          type: array
          items:
            type: string
    HoldFilter:
      type: object
      additionalProperties: false
      description: A search filter; the messages search finds with it are held.
      properties:
        q:
          type: string
        from:
          type: string
        to:
          type: string
        attachment:
          type: string
        hasAttachment:
          type: boolean
    LegalHold:
      type: object
      required: [id, name, reason, user, accountId, account, accountOwner, filter, since, until, matchedAt, matched,
                 createdAt, createdBy, releasedAt, releasedBy, releaseNote]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        reason:
          type: string
        user:
          type: string
          description: The user whose mail is held; empty for none.
        accountId:
          type: [integer, "null"]
          format: int64
        account:
          type: string
        accountOwner:
          type: string
        filter:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/HoldFilter"
        since:
          type: [string, "null"]
          format: date-time
        until:
          type: [string, "null"]
          format: date-time
        matchedAt:
          type: [string, "null"]
          format: date-time
          description: When the filter's matches were last stored; until then the hold covers its whole scope.
        matched:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        releasedAt:
          type: [string, "null"]
          format: date-time
        releasedBy:
          type: string
        releaseNote:
          type: string
    Envelope:
      type: object
      description: The SMTP envelope of a message in an smtp account.
      required: [mailFrom, rcptTo, receivedAt, clientIp, helo]
      properties:
        mailFrom:
          type: string
        rcptTo:
          type: array
          description: The original recipients, BCC included.
          items:
            type: string
        receivedAt:
          type: string
          format: date-time
        clientIp:
          type: string
        helo:
          type: string
    ConversationEntry:
      type: object
      required: [id, subject, from, sentAt, sortAt, relation]
      properties:
        id:
          type: string
        subject:
          type: string
        from:
          type: string
        sentAt:
          type: [string, "null"]
          format: date-time
        sortAt:
          type: string
          format: date-time
        relation:
          type: string
          enum: [self, parent, reply, thread]
