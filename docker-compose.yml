# Usage (see README):
#   cp .env.example .env              # then set passwords and the secret key
#   ./ma migrate                      # wrapper around `docker compose run`
#   ./ma account add ...
#   ./ma sync
#   ./ma user add NAME --admin        # first login for the web UI
#   docker compose up -d web          # web UI on http://localhost:8080 (image built by ./ma)
#
# Both images are multi-arch (amd64 and arm64, e.g. Apple Silicon).

name: mail-archive

services:
  postgres:
    # The Debian image, not -alpine: full-text search is up to 2.3 times
    # slower with musl (#145). Do not switch an existing volume between the
    # two: they sort text differently, so text indexes need a REINDEX.
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailarchive
      POSTGRES_USER: mailarchive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ images keep data in a versioned subdirectory
      # (/var/lib/postgresql/<major>/docker), so the volume is mounted one
      # level up. Major upgrades need pg_upgrade or dump/restore.
      - pgdata:/var/lib/postgresql
    ports:
      # Only reachable from this machine; remove if not needed.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailarchive -d mailarchive"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Web server (UI and JSON API, login required). Reachable from this machine
  # only unless WEB_BIND is set; see docs/reference/security.md.
  # Start or update with: ./ma migrate && docker compose up -d web
  web:
    build:
      context: .
      args:
        VERSION: ${MAIL_ARCHIVE_VERSION:-dev} # set by ./ma from `git describe`
    image: ${MAIL_ARCHIVE_IMAGE:-mail-archive:local}
    restart: unless-stopped
    command: ["serve", "--listen", ":8080"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MAIL_ARCHIVE_DATABASE_URL: postgres://mailarchive:${POSTGRES_PASSWORD}@postgres:5432/mailarchive?sslmode=disable
      MAIL_ARCHIVE_SECRET_KEY: ${MAIL_ARCHIVE_SECRET_KEY:?set MAIL_ARCHIVE_SECRET_KEY in .env}
      MAIL_ARCHIVE_LOG_LEVEL: ${MAIL_ARCHIVE_LOG_LEVEL:-info}
      MAIL_ARCHIVE_ALLOWED_HOSTS: ${MAIL_ARCHIVE_ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Reverse proxies whose X-Forwarded-For names the client (audit log,
      # login limits). Empty: the direct peer counts.
      MAIL_ARCHIVE_TRUSTED_PROXIES: ${MAIL_ARCHIVE_TRUSTED_PROXIES:-}
      # How often each enabled account is synced unless it has its own
      # interval; 0 turns the schedule off for every account.
      MAIL_ARCHIVE_SYNC_INTERVAL: ${MAIL_ARCHIVE_SYNC_INTERVAL:-6h}
      # The shortest interval any account is synced at.
      MAIL_ARCHIVE_SYNC_INTERVAL_MIN: ${MAIL_ARCHIVE_SYNC_INTERVAL_MIN:-5m}
      # How often each folder is compared with the server; 0 = only on request.
      MAIL_ARCHIVE_RECONCILE_INTERVAL: ${MAIL_ARCHIVE_RECONCILE_INTERVAL:-24h}
      MAIL_ARCHIVE_REQUIRE_2FA: ${MAIL_ARCHIVE_REQUIRE_2FA:-false}
      # The address you open in the browser; passkeys work only there.
      MAIL_ARCHIVE_PUBLIC_URL: ${MAIL_ARCHIVE_PUBLIC_URL:-http://localhost:${WEB_PORT:-8080}}
      # Alerts when syncs of an account keep failing; see the Operations guide.
      MAIL_ARCHIVE_ALERT_AFTER_FAILURES: ${MAIL_ARCHIVE_ALERT_AFTER_FAILURES:-3}
      MAIL_ARCHIVE_NOTIFY_WEBHOOK_URL: ${MAIL_ARCHIVE_NOTIFY_WEBHOOK_URL:-}
      MAIL_ARCHIVE_NOTIFY_WEBHOOK_FORMAT: ${MAIL_ARCHIVE_NOTIFY_WEBHOOK_FORMAT:-json}
      MAIL_ARCHIVE_NOTIFY_WEBHOOK_AUTHORIZATION: ${MAIL_ARCHIVE_NOTIFY_WEBHOOK_AUTHORIZATION:-}
      # Journaling over SMTP for smtp accounts; off unless the listen address is set.
      MAIL_ARCHIVE_SMTP_LISTEN: ${MAIL_ARCHIVE_SMTP_LISTEN:-}
      MAIL_ARCHIVE_SMTP_ALLOWED_NETWORKS: ${MAIL_ARCHIVE_SMTP_ALLOWED_NETWORKS:-}
      MAIL_ARCHIVE_SMTP_MAX_SIZE: ${MAIL_ARCHIVE_SMTP_MAX_SIZE:-}
      MAIL_ARCHIVE_SMTP_HOSTNAME: ${MAIL_ARCHIVE_SMTP_HOSTNAME:-}
      MAIL_ARCHIVE_SMTP_TLS_CERT: ${MAIL_ARCHIVE_SMTP_TLS_CERT:-}
      MAIL_ARCHIVE_SMTP_TLS_KEY: ${MAIL_ARCHIVE_SMTP_TLS_KEY:-}
      # Tamper evidence: the key that signs attestations (default
      # /data/attest/signing.key, create with `./ma attest keygen`) and how
      # often one is written; 0 turns the schedule off.
      MAIL_ARCHIVE_ATTEST_KEY_FILE: ${MAIL_ARCHIVE_ATTEST_KEY_FILE:-}
      MAIL_ARCHIVE_ATTEST_INTERVAL: ${MAIL_ARCHIVE_ATTEST_INTERVAL:-24h}
      # How long the files of messages deleted by retention stay (backups).
      MAIL_ARCHIVE_RETENTION_FILE_GRACE: ${MAIL_ARCHIVE_RETENTION_FILE_GRACE:-168h}
    volumes:
      - ${ARCHIVE_DIR:-./data}:/data
    ports:
      # WEB_BIND=0.0.0.0 (or a LAN or Tailscale address) opens it to a network.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
      # SMTP for journaling, with MAIL_ARCHIVE_SMTP_LISTEN=:2525.
      - "${SMTP_BIND:-127.0.0.1}:${SMTP_PORT:-2525}:2525"

  mail-archive:
    build:
      context: .
      args:
        VERSION: ${MAIL_ARCHIVE_VERSION:-dev} # set by ./ma from `git describe`
    image: ${MAIL_ARCHIVE_IMAGE:-mail-archive:local}
    # One-shot CLI: not started by `docker compose up`, use `docker compose run`.
    profiles: ["cli"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MAIL_ARCHIVE_DATABASE_URL: postgres://mailarchive:${POSTGRES_PASSWORD}@postgres:5432/mailarchive?sslmode=disable
      MAIL_ARCHIVE_SECRET_KEY: ${MAIL_ARCHIVE_SECRET_KEY:?set MAIL_ARCHIVE_SECRET_KEY in .env}
      MAIL_ARCHIVE_LOG_LEVEL: ${MAIL_ARCHIVE_LOG_LEVEL:-info}
      # `./ma status` shows when each account is due and whether it is
      # stale; `./ma account set-schedule` checks the floor.
      MAIL_ARCHIVE_SYNC_INTERVAL: ${MAIL_ARCHIVE_SYNC_INTERVAL:-6h}
      MAIL_ARCHIVE_SYNC_INTERVAL_MIN: ${MAIL_ARCHIVE_SYNC_INTERVAL_MIN:-5m}
      # `./ma sync` compares folders with the server when this is due.
      MAIL_ARCHIVE_RECONCILE_INTERVAL: ${MAIL_ARCHIVE_RECONCILE_INTERVAL:-24h}
      # Alerts when syncs of an account keep failing; see the Operations guide.
      MAIL_ARCHIVE_ALERT_AFTER_FAILURES: ${MAIL_ARCHIVE_ALERT_AFTER_FAILURES:-3}
      MAIL_ARCHIVE_NOTIFY_WEBHOOK_URL: ${MAIL_ARCHIVE_NOTIFY_WEBHOOK_URL:-}
      MAIL_ARCHIVE_NOTIFY_WEBHOOK_FORMAT: ${MAIL_ARCHIVE_NOTIFY_WEBHOOK_FORMAT:-json}
      MAIL_ARCHIVE_NOTIFY_WEBHOOK_AUTHORIZATION: ${MAIL_ARCHIVE_NOTIFY_WEBHOOK_AUTHORIZATION:-}
      # Read by `./ma account add-smtp` to tell whether the web server receives.
      MAIL_ARCHIVE_SMTP_LISTEN: ${MAIL_ARCHIVE_SMTP_LISTEN:-}
      MAIL_ARCHIVE_SMTP_ALLOWED_NETWORKS: ${MAIL_ARCHIVE_SMTP_ALLOWED_NETWORKS:-}
      MAIL_ARCHIVE_SMTP_MAX_SIZE: ${MAIL_ARCHIVE_SMTP_MAX_SIZE:-}
      MAIL_ARCHIVE_SMTP_HOSTNAME: ${MAIL_ARCHIVE_SMTP_HOSTNAME:-}
      MAIL_ARCHIVE_SMTP_TLS_CERT: ${MAIL_ARCHIVE_SMTP_TLS_CERT:-}
      MAIL_ARCHIVE_SMTP_TLS_KEY: ${MAIL_ARCHIVE_SMTP_TLS_KEY:-}
      # Read by `./ma attest` and `./ma attest keygen`.
      MAIL_ARCHIVE_ATTEST_KEY_FILE: ${MAIL_ARCHIVE_ATTEST_KEY_FILE:-}
      MAIL_ARCHIVE_ATTEST_INTERVAL: ${MAIL_ARCHIVE_ATTEST_INTERVAL:-24h}
      # How long the files of messages deleted by retention stay (backups).
      MAIL_ARCHIVE_RETENTION_FILE_GRACE: ${MAIL_ARCHIVE_RETENTION_FILE_GRACE:-168h}
    volumes:
      # Raw .eml files. A bind mount keeps them visible on the host for backups.
      - ${ARCHIVE_DIR:-./data}:/data
      # mbox files and Maildirs for `./ma import`, read-only.
      - ${IMPORT_DIR:-./import}:/import:ro

volumes:
  pgdata:
